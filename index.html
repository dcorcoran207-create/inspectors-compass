<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Inspector's Compass</title><style>*{box-sizing:border-box}body{margin:0;background:#071421;color:#f5f7fa;font-family:system-ui;padding-bottom:80px}header{position:sticky;top:0;background:#06111d;border-bottom:1px solid #203b55;padding:16px 20px;z-index:3}.brand{font-weight:800}.brand small{display:block;color:#a9b7c8}main{max-width:760px;margin:auto;padding:24px 20px}h1{font-size:38px}.gold{color:#edbd4f;font-weight:800}.muted{color:#a9b7c8}.primary,.card,.answer{width:100%;border-radius:18px;padding:17px;margin:7px 0;border:1px solid #203b55}.primary{background:#edbd4f;color:#17202a;font-weight:800;text-align:center}.card,.answer{background:#102235;color:#f5f7fa}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats div{background:#102235;border:1px solid #203b55;border-radius:18px;padding:15px;text-align:center}.stats strong{display:block;font-size:28px}nav{position:fixed;bottom:0;left:0;right:0;background:#091827;border-top:1px solid #203b55;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}nav button{background:none;border:0;color:#a9b7c8;padding:13px 3px}nav .active{color:#edbd4f}.sheet{white-space:pre-wrap;line-height:1.55;background:#102235;border:1px solid #203b55;border-radius:18px;padding:18px}.answer{text-align:left}.correct{border-color:#2fbf71}.wrong{border-color:#d85b5b}.explain{background:#102235;border:1px solid #203b55;border-radius:18px;padding:18px}.star{float:right;background:none;border:0;color:#edbd4f;font-size:24px}</style></head><body><div id=app></div><script>const Q=[{"id": 1, "topic": "Stop & Search — PACE Code A", "question": "An Inspector is considering an initial section 60 authorisation after intelligence indicates rival groups may engage in serious violence in a town centre. Which statement correctly states the rank and one statutory route for an initial section 60 authorisation?", "options": ["Superintendent or above, on reasonable suspicion that violence may occur.", "Inspector or above, on reasonable belief that incidents involving serious violence may take place in a locality and that authorisation is expedient to prevent them.", "Sergeant or above, whenever offensive weapons might be present.", "Chief Inspector or above, but only after serious violence has already occurred."], "answer": 1, "explanation": "Code A 2.12-2.13 requires an officer of Inspector rank or above. One route is reasonable belief that incidents involving serious violence may take place in a locality and that it is expedient to give the authorisation to prevent them.", "reference": "CJPOA 1994 s.60; Code A 2.12-2.13 • Blackstone GPD 2023 Stop & Search pp. 9-10"}, {"id": 2, "topic": "Stop & Search — PACE Code A", "question": "A section 60 authorisation has been in force for 24 hours. Offences connected with the relevant activity have been committed and further use of the power appears necessary. Who may extend the authorisation, and for how long?", "options": ["Inspector or above, for a further 12 hours.", "Superintendent or above, for a further period not exceeding 24 hours.", "Chief Constable only, for a further 48 hours.", "Any officer who gave the original authorisation, for 24 hours."], "answer": 1, "explanation": "The supplied text states that an officer of Superintendent rank or above may extend a section 60 authorisation for a further period not exceeding 24 hours when the continuation conditions are met.", "reference": "CJPOA 1994 s.60; Code A / Keynote 3.1.4.10 • Blackstone GPD 2023 Stop & Search pp. 10-11"}, {"id": 3, "topic": "Stop & Search — PACE Code A", "question": "An Inspector gives an urgent section 60 authorisation orally. What must happen to the oral authorisation?", "options": ["It is invalid until a magistrate confirms it.", "It must be recorded in writing as soon as practicable, including the statutory particulars.", "It may remain oral for the whole authorised period.", "It must be confirmed by a Chief Inspector within one hour."], "answer": 1, "explanation": "Code A permits an oral authorisation in the specified circumstances, but it must be recorded in writing as soon as practicable with the required grounds, locality and period.", "reference": "CJPOA 1994 s.60; Code A 2.13 • Blackstone GPD 2023 Stop & Search pp. 9-11"}, {"id": 4, "topic": "Stop & Search — PACE Code A", "question": "A section 60 authorisation is in force in a defined locality. What is different about the grounds required for an individual search carried out under that authorisation?", "options": ["The searching constable must still have reasonable grounds to suspect that particular person.", "No individual reasonable suspicion is required, but the power must be exercised within the authorisation and Code A safeguards.", "The person must first consent.", "A Superintendent must approve each individual search."], "answer": 1, "explanation": "Section 60 is a suspicionless power once a valid authorisation is in force. The officer does not need reasonable grounds against the individual, but the authorisation and Code A limits still govern the search.", "reference": "CJPOA 1994 s.60; Code A 2.12 onwards • Blackstone GPD 2023 Stop & Search pp. 9-12"}, {"id": 5, "topic": "Stop & Search — PACE Code A", "question": "An officer believes a person may be carrying stolen property and is considering a section 1 PACE search. What two elements make up reasonable grounds for suspicion under the supplied Code A text?", "options": ["An honest suspicion and approval from a supervisor.", "A genuine suspicion in the officer's own mind and an objective basis for that suspicion.", "A previous conviction and presence in a high-crime area.", "A victim complaint and a refusal to answer questions."], "answer": 1, "explanation": "Code A describes a two-part test: the officer must genuinely suspect the object will be found and there must be an objective basis for that suspicion founded on facts, information or intelligence.", "reference": "PACE 1984 s.1; Code A 2.2 • Blackstone GPD 2023 Stop & Search pp. 5-6"}, {"id": 6, "topic": "Stop & Search — PACE Code A", "question": "An officer sees a person in an area associated with theft and recognises them as having previous convictions. Can previous convictions and general personal factors alone create reasonable grounds to search?", "options": ["Yes, if the officer knows the person has relevant convictions.", "Yes, if the area also has a high crime rate.", "No. Personal factors such as appearance or previous convictions cannot themselves provide the objective basis required.", "Only if a Sergeant agrees."], "answer": 2, "explanation": "The supplied Code A text states that reasonable suspicion can never be supported on personal factors alone; the officer needs an objective basis in current facts, information or intelligence.", "reference": "Code A 2.2A • Blackstone GPD 2023 Stop & Search p. 6"}, {"id": 7, "topic": "Stop & Search — PACE Code A", "question": "An officer has reliable current intelligence that a particular gang habitually carries knives at organised meetings. A person is objectively identifiable as a member of that gang and is attending such a meeting. How may the intelligence affect reasonable suspicion?", "options": ["It can never be relevant because group membership can never be considered.", "It may provide an objective basis for reasonable suspicion, subject to the specific Code A safeguards and the facts of the encounter.", "It automatically permits a strip search.", "It creates section 60 powers without an authorisation."], "answer": 1, "explanation": "Code A allows specific and reliable intelligence about a group or gang to contribute to reasonable suspicion where there is an objective connection between the person, the group and the prohibited articles.", "reference": "Code A 2.6-2.6A • Blackstone GPD 2023 Stop & Search pp. 6-7"}, {"id": 8, "topic": "Stop & Search — PACE Code A", "question": "An officer encounters a person whose behaviour, time and location appear unusual but has no other supporting facts. What does Code A say about a hunch or instinct?", "options": ["A hunch is enough if the officer has more than five years' service.", "A hunch alone cannot be justified as an objective basis for reasonable suspicion.", "A hunch is enough in a high-crime area.", "A hunch is enough if the search is brief."], "answer": 1, "explanation": "The supplied text makes clear that reasonable suspicion must have an objective basis; a hunch or instinct unsupported by objective grounds is insufficient.", "reference": "Code A 2.6B • Blackstone GPD 2023 Stop & Search p. 7"}, {"id": 9, "topic": "Stop & Search — PACE Code A", "question": "An officer has reasonable grounds to suspect a person but asks brief questions before deciding whether to search. What is the proper purpose of such questioning?", "options": ["To obtain a confession before searching.", "To clarify the person's behaviour or presence and potentially confirm or dispel the grounds for suspicion.", "To delay the person until a supervisor arrives.", "To create grounds where none existed by detaining the person for questioning."], "answer": 1, "explanation": "Code A 2.9 permits questions about behaviour or presence where reasonable grounds exist. Answers may confirm or dispel suspicion; a person must not be detained merely to find grounds through questioning.", "reference": "Code A 2.9 • Blackstone GPD 2023 Stop & Search pp. 7-8"}, {"id": 10, "topic": "Stop & Search — PACE Code A", "question": "A person gives a credible explanation which removes the factual basis for an officer's proposed search. What should the officer do?", "options": ["Search anyway because the officer had initially formed suspicion.", "Treat the explanation as irrelevant.", "Reassess the grounds; if suspicion is dispelled, the search should not proceed on the original basis.", "Arrest the person for refusing a search."], "answer": 2, "explanation": "Code A 2.9 recognises that preliminary questioning can dispel reasonable suspicion. If the objective basis disappears, the original search justification disappears with it.", "reference": "Code A 2.9 • Blackstone GPD 2023 Stop & Search pp. 7-8"}, {"id": 11, "topic": "Stop & Search — PACE Code A", "question": "An officer reasonably suspects that a pedestrian has stolen property concealed in a bag. Which power is the core statutory stop-and-search power for stolen or prohibited articles?", "options": ["PACE 1984 s.1.", "Misuse of Drugs Act 1971 s.23.", "Firearms Act 1968 s.47.", "CJPOA 1994 s.60 only."], "answer": 0, "explanation": "The Annex A table identifies PACE s.1 as the principal stop-and-search power for stolen or prohibited articles.", "reference": "PACE 1984 s.1; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, pp. 24-25"}, {"id": 12, "topic": "Stop & Search — PACE Code A", "question": "An officer reasonably suspects that a driver has controlled drugs in the vehicle. Which power in Annex A applies?", "options": ["PACE 1984 s.1 only.", "Misuse of Drugs Act 1971 s.23.", "Firearms Act 1968 s.47.", "CJPOA 1994 s.60."], "answer": 1, "explanation": "Annex A identifies Misuse of Drugs Act 1971 s.23 as the stop-and-search power for controlled drugs.", "reference": "Misuse of Drugs Act 1971 s.23; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 24"}, {"id": 13, "topic": "Stop & Search — PACE Code A", "question": "An officer has the statutory grounds to search for firearms. Which power in Annex A is the principal firearms stop-and-search power?", "options": ["PACE 1984 s.1.", "Firearms Act 1968 s.47.", "Misuse of Drugs Act 1971 s.23.", "Police Reform Act 2002 Sch.4."], "answer": 1, "explanation": "Annex A lists Firearms Act 1968 s.47 for firearms searches in the statutory circumstances described there.", "reference": "Firearms Act 1968 s.47; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 24"}, {"id": 14, "topic": "Stop & Search — PACE Code A", "question": "An officer is searching school premises for an offensive weapon or bladed/sharply pointed article. Which statutory power is listed in Annex A?", "options": ["Criminal Justice Act 1988 s.139B.", "Crossbows Act 1987 s.4.", "Poaching Prevention Act 1862 s.2.", "Protection of Badgers Act 1992 s.10."], "answer": 0, "explanation": "Annex A lists Criminal Justice Act 1988 s.139B for offensive weapons and bladed or sharply pointed articles on school premises.", "reference": "Criminal Justice Act 1988 s.139B; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 25"}, {"id": 15, "topic": "Stop & Search — PACE Code A", "question": "Police suspect a person in a public place of possessing game or poaching equipment in circumstances engaging the statutory power. Which Act is listed in Annex A?", "options": ["Poaching Prevention Act 1862 s.2.", "Deer Act 1991 s.12 only.", "Wildlife and Countryside Act 1981 s.19 only.", "Sporting Events (Control of Alcohol etc.) Act 1985 s.7."], "answer": 0, "explanation": "Annex A lists Poaching Prevention Act 1862 s.2 for game or poaching equipment, exercisable in a public place.", "reference": "Poaching Prevention Act 1862 s.2; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 25"}, {"id": 16, "topic": "Stop & Search — PACE Code A", "question": "An officer starts a standard public stop and search under section 1 PACE. What clothing may the officer require the person to remove in public under the ordinary Code A rule?", "options": ["Outer coat, jacket and gloves.", "Shirt, trousers and shoes.", "Any clothing if the officer is the same sex.", "Headgear, footwear and all outer clothing in every case."], "answer": 0, "explanation": "Code A 3.5 states that the ordinary power does not allow a person to be required to remove clothing in public other than an outer coat, jacket or gloves, subject to the separate statutory exceptions described in the text.", "reference": "Code A 3.5 • Blackstone GPD 2023 Stop & Search p. 16"}, {"id": 17, "topic": "Stop & Search — PACE Code A", "question": "An officer needs a more thorough search that requires removal of more than an outer coat, jacket or gloves. What safeguard applies?", "options": ["It may be done in public if a second officer is present.", "It must be conducted out of public view and by an officer of the same sex, subject to the Code's detailed rules.", "It may only be done by an Inspector.", "It always requires arrest first."], "answer": 1, "explanation": "Code A 3.6 requires a more thorough search involving removal of more clothing to be conducted out of public view and by an officer of the same sex, with the additional safeguards in the Code.", "reference": "Code A 3.6 • Blackstone GPD 2023 Stop & Search p. 16"}, {"id": 18, "topic": "Stop & Search — PACE Code A", "question": "An officer is searching for a tiny item that could reasonably be hidden in a person's hair. May the person's hair be searched in public?", "options": ["No, hair can never be searched during a public stop and search.", "Yes, where the object sought could reasonably be concealed there and the search is proportionate.", "Only after arrest.", "Only by a medical practitioner."], "answer": 1, "explanation": "Code A 3.5 says the extent of a search must depend on what is suspected of being carried and notes that a person's hair may be searched in public.", "reference": "Code A 3.3-3.5 • Blackstone GPD 2023 Stop & Search p. 16"}, {"id": 19, "topic": "Stop & Search — PACE Code A", "question": "An officer is searching for an item small enough to be concealed inside a coat pocket. Which principle controls how far the search may go?", "options": ["The officer may search every part of the person's clothing regardless of the object sought.", "The extent of the search must be reasonably related to where the object could be concealed.", "The search must always include removal of footwear.", "The search may never include putting hands inside pockets."], "answer": 1, "explanation": "Code A 3.3-3.5 links the extent of the search to the nature of the object sought. Officers may search places where it could reasonably be concealed and should not go further than necessary.", "reference": "Code A 3.3-3.5 • Blackstone GPD 2023 Stop & Search p. 16"}, {"id": 20, "topic": "Stop & Search — PACE Code A", "question": "A stop-and-search detention is taking longer than necessary because officers are waiting for paperwork that could be completed afterwards. Which Code A principle is engaged?", "options": ["Detention for search should be kept to the minimum necessary.", "Any stop and search may last up to six hours.", "Only a supervisor may decide when a search ends.", "The person must remain until a written record is printed."], "answer": 0, "explanation": "Code A states that detention for the purposes of a search must be kept to the minimum necessary and the search should normally take place at or near the place of the stop.", "reference": "Code A 1.2 and 3.4 • Blackstone GPD 2023 Stop & Search pp. 2, 16"}, {"id": 21, "topic": "Stop & Search — PACE Code A", "question": "Before searching a detained person, an officer gives the grounds and object but not their identity or station. Which statement is correct?", "options": ["That is sufficient because grounds and object are the only mandatory information.", "The officer must also provide the identity/station information required by Code A before the search, subject to the stated safety exception.", "Identity is required only after the search.", "Identity is required only if an arrest follows."], "answer": 1, "explanation": "Code A 3.8 requires specified information before the search, including the officer's identity details and police station, subject to the permitted exception where naming the officer creates a genuine risk.", "reference": "PACE 1984 s.2; Code A 3.8 • Blackstone GPD 2023 Stop & Search p. 17"}, {"id": 22, "topic": "Stop & Search — PACE Code A", "question": "An officer is about to carry out a section 1 PACE search. What must the person be told about the object of the search?", "options": ["Only that the officer is conducting a lawful search.", "The object of the search in terms of the article or articles being looked for.", "The maximum sentence for any offence discovered.", "The name of the custody officer."], "answer": 1, "explanation": "Code A 3.8 requires a clear explanation of the object of the search in terms of the article or articles for which there is a power to search.", "reference": "PACE 1984 s.2; Code A 3.8 • Blackstone GPD 2023 Stop & Search p. 17"}, {"id": 23, "topic": "Stop & Search — PACE Code A", "question": "An officer is not in uniform and intends to carry out a stop and search. What additional step is required before the search?", "options": ["Obtain written Inspector authority.", "Show their warrant card.", "Call a uniformed officer to conduct the search.", "Arrest the person first."], "answer": 1, "explanation": "Code A 3.8 requires an officer not in uniform to show their warrant card before the search.", "reference": "PACE 1984 s.2; Code A 3.8 • Blackstone GPD 2023 Stop & Search p. 17"}, {"id": 24, "topic": "Stop & Search — PACE Code A", "question": "A person is detained for a search under a statutory power requiring reasonable suspicion. What must the officer explain about the grounds?", "options": ["The officer need only say 'intelligence received'.", "The officer must explain the grounds for the search, not merely state the statutory power.", "The grounds can be withheld in every case.", "Grounds are required only if something is found."], "answer": 1, "explanation": "Code A 3.8 requires the grounds for the search to be explained where the power depends on reasonable suspicion.", "reference": "PACE 1984 s.2; Code A 3.8 • Blackstone GPD 2023 Stop & Search p. 17"}, {"id": 25, "topic": "Stop & Search — PACE Code A", "question": "A person is about to be searched and asks whether they can obtain a copy of the search record. What should the officer tell them?", "options": ["They have no entitlement unless arrested.", "They are entitled to the record in accordance with the Code and must be told how it can be obtained.", "Only their solicitor can obtain it.", "The record is confidential to police."], "answer": 1, "explanation": "Code A requires the person to be informed of their entitlement to a copy/access to the search record and the mechanism for obtaining it.", "reference": "PACE 1984 s.3; Code A 3.8 and 4.2 • Blackstone GPD 2023 Stop & Search pp. 17-20"}, {"id": 26, "topic": "Stop & Search — PACE Code A", "question": "A search does not result in arrest and making an immediate written record is wholly impracticable because of serious public disorder. When must the officer make the record?", "options": ["Only if the person later asks for one.", "As soon as practicable after the search.", "Within seven days.", "Before the end of the officer's next tour."], "answer": 1, "explanation": "Code A 4.1 requires the record to be made on the spot unless that is wholly impracticable; if so, it must be made as soon as practicable afterwards.", "reference": "Code A 4.1 • Blackstone GPD 2023 Stop & Search p. 19"}, {"id": 27, "topic": "Stop & Search — PACE Code A", "question": "A person is searched but not arrested and is not given a copy of the record at the scene. How long do they have to request access to the record?", "options": ["14 days.", "28 days.", "Three months from the date of the search.", "One year."], "answer": 2, "explanation": "The supplied Code A text states that where a copy is not provided at the time, the person may apply for a copy/access within three months.", "reference": "PACE 1984 s.3; Code A 4.2 • Blackstone GPD 2023 Stop & Search pp. 18-20"}, {"id": 28, "topic": "Stop & Search — PACE Code A", "question": "A stop and search leads directly to arrest. How may the search record be made?", "options": ["No record is required because an arrest occurred.", "It may be made as part of the person's custody record at the police station.", "It must be sent to a magistrates' court.", "It must be completed only after charge."], "answer": 1, "explanation": "Code A provides that where a search results in arrest, the search record may be made as part of the person's custody record.", "reference": "Code A 4.2B • Blackstone GPD 2023 Stop & Search p. 20"}, {"id": 29, "topic": "Stop & Search — PACE Code A", "question": "Police search a vehicle and two occupants for the same object on the same grounds. Which recording rule applies?", "options": ["One record can cover everyone because the grounds are the same.", "A separate record must be made for each person searched; where a person and vehicle are searched on the same object and grounds, that person's record can also cover the vehicle search.", "Only the driver needs a record.", "No record is needed for the vehicle."], "answer": 1, "explanation": "Code A 4.5 requires a record for each person and each vehicle searched, but allows one record to cover a person and vehicle where the object and grounds are the same. More than one person searched requires separate person records.", "reference": "Code A 4.5 • Blackstone GPD 2023 Stop & Search p. 21"}, {"id": 30, "topic": "Stop & Search — PACE Code A", "question": "An unattended vehicle is searched under a statutory stop-and-search power. What must officers do after the search?", "options": ["Wait until the owner returns.", "Leave the required notice on or in the vehicle stating that it has been searched and giving the prescribed information.", "Tow the vehicle in every case.", "Notify the local authority."], "answer": 1, "explanation": "The supplied text requires a notice to be left on or in an unattended vehicle after search, with the required information and route to obtain the search record.", "reference": "Code A 4.8-4.9; Keynote 3.1.5.2 • Blackstone GPD 2023 Stop & Search pp. 18, 21"}, {"id": 31, "topic": "Stop & Search — PACE Code A", "question": "An officer records the grounds for a search simply as 'known thief in a high-crime area'. What is the problem?", "options": ["The record need only identify the person's previous convictions.", "The record should briefly but informatively explain the reason for suspecting the person, with reference to the information and/or intelligence on which it was based.", "Grounds never need to be recorded.", "Only the outcome of the search matters."], "answer": 1, "explanation": "Code A 4.6 requires the grounds entry to explain briefly but informatively why the person was suspected, with reference to the information and/or intelligence relied on.", "reference": "Code A 4.6 • Blackstone GPD 2023 Stop & Search p. 21"}, {"id": 32, "topic": "Stop & Search — PACE Code A", "question": "An officer stops a person in a public place merely to ask where they are going and why, without using a statutory stop-and-search power. What is the national recording requirement under the supplied Code A text?", "options": ["A full stop-and-search record is mandatory.", "There is no national requirement to record that non-statutory encounter or give a receipt merely because the officer asked such questions.", "The encounter must be authorised by an Inspector.", "The person must provide fingerprints."], "answer": 1, "explanation": "The Code states there is no national requirement to record encounters not governed by statutory stop-and-search powers merely because an officer asks a person to account for themselves, their actions, behaviour, presence or possession.", "reference": "Code A 4.12 • Blackstone GPD 2023 Stop & Search p. 22"}, {"id": 33, "topic": "Stop & Search — PACE Code A", "question": "A person searched speaks very little English and appears not to understand the information being given. What should the officer do?", "options": ["Proceed without explaining anything because the power is statutory.", "Take reasonable steps to bring the required information to the person's attention, using appropriate assistance or material where practicable.", "Arrest the person for non-cooperation.", "Abandon every lawful search involving a language barrier."], "answer": 1, "explanation": "Code A requires reasonable steps to make the required information understood where the person does not appear to understand English, including appropriate interpretation or explanatory material where practicable.", "reference": "Code A 3.10-3.11 • Blackstone GPD 2023 Stop & Search p. 18"}, {"id": 34, "topic": "Stop & Search — PACE Code A", "question": "A supervisor reviews a set of stop-and-search records at the end of a tour. What is a core supervisory responsibility?", "options": ["Check that powers are being used lawfully and appropriately, including scrutinising recorded grounds.", "Delete records where nothing was found.", "Approve only searches that led to arrest.", "Require a magistrate to countersign every search."], "answer": 0, "explanation": "Code A 5.1 onwards requires supervisors to monitor the use of stop-and-search powers and scrutinise records, including the grounds recorded and the way powers are being exercised.", "reference": "Code A 5.1-5.4 • Blackstone GPD 2023 Stop & Search p. 23"}, {"id": 35, "topic": "Stop & Search — PACE Code A", "question": "A supervisor identifies repeated searches by an officer where the recorded grounds do not support reasonable suspicion. What should the supervisor do?", "options": ["Ignore the issue unless a complaint is made.", "Review the circumstances and take appropriate action where misuse or a breach of standards is identified.", "Automatically dismiss the officer.", "Erase the search records."], "answer": 1, "explanation": "The supervision section requires active scrutiny and appropriate action where misuse is identified; the response depends on the facts and may include performance or misconduct processes.", "reference": "Code A 5.5-5.6 • Blackstone GPD 2023 Stop & Search p. 23"}, {"id": 36, "topic": "Stop & Search — PACE Code A", "question": "Police are planning stop-and-search activity involving children. What safeguarding duty is emphasised by Code A?", "options": ["Children must always be arrested before search.", "Police must have regard to the need to safeguard and promote the welfare of persons under 18.", "Every child search requires parental presence.", "Every child search must take place at a police station."], "answer": 1, "explanation": "Code A 1.1 refers to the duty under section 11 Children Act 2004 to have regard to the need to safeguard and promote the welfare of children.", "reference": "Children Act 2004 s.11; Code A 1.1 • Blackstone GPD 2023 Stop & Search p. 2"}, {"id": 37, "topic": "Stop & Search — PACE Code A", "question": "An officer has no statutory search power but asks a person to agree voluntarily to being searched in the street. What does Code A say?", "options": ["The search is lawful if the person signs a consent form.", "An officer must not search a person merely by consent where no statutory power applies, apart from the limited entry-condition exception described in the Code.", "Consent creates a temporary section 1 PACE power.", "Consent searches are allowed only for people over 18."], "answer": 1, "explanation": "Code A 1.5 prohibits routine consent searches where no statutory power exists, apart from the specific exception for searches as a condition of entry to premises such as sports grounds.", "reference": "Code A 1.5 • Blackstone GPD 2023 Stop & Search p. 2"}, {"id": 38, "topic": "Stop & Search — PACE Code A", "question": "An officer breaches important Code A safeguards during a search and evidence is later relied on in court. What consequence does Code A identify?", "options": ["The evidence is automatically destroyed.", "The evidence may be open to challenge in court.", "The prosecution automatically ends.", "The officer is automatically imprisoned."], "answer": 1, "explanation": "Code A 1.6 states that evidence obtained where the Code's provisions are not observed may be open to challenge.", "reference": "Code A 1.6 • Blackstone GPD 2023 Stop & Search p. 2"}, {"id": 39, "topic": "Stop & Search — PACE Code A", "question": "A stand-alone section 60AA authorisation is being considered, rather than relying on an existing section 60 authorisation. Which statement best reflects the authorisation route described in the supplied material?", "options": ["Any constable may create the power whenever a face covering is seen.", "An Inspector or above may authorise the power for a locality where the statutory test concerning activities involving offences is met; the individual constable must still reasonably believe an item is worn wholly or mainly to conceal identity before requiring removal.", "A magistrate must authorise every use.", "A Superintendent must personally identify every person wearing a face covering."], "answer": 1, "explanation": "The supplied section 60AA material distinguishes the area authorisation from the individual constable's exercise of the removal power. The latter depends on a reasonable belief that the item is worn wholly or mainly to conceal identity.", "reference": "CJPOA 1994 s.60AA; Keynote 3.1.4.9-3.1.4.10 • Blackstone GPD 2023 Stop & Search pp. 12-13"}, {"id": 40, "topic": "Stop & Search — PACE Code A", "question": "A person refuses a lawful requirement by a constable to remove an item under section 60AA. What is the legal consequence identified in the supplied material?", "options": ["No offence is committed.", "A specific offence is committed under section 60AA(7).", "Only a civil penalty is available.", "The refusal merely ends the encounter."], "answer": 1, "explanation": "The Keynote expressly identifies failure to comply with a lawful section 60AA requirement as an offence under section 60AA(7).", "reference": "CJPOA 1994 s.60AA(7); Keynote 3.1.4.14 • Blackstone GPD 2023 Stop & Search p. 14"}, {"id": 41, "topic": "Stop & Search — PACE Code A", "question": "A constable reasonably believes that an item worn for religious reasons is also being worn wholly or mainly to conceal identity, and a lawful removal power is engaged. What handling does the Code recommend where practicable?", "options": ["Remove it immediately in full public view.", "Allow removal out of public view and in the presence of an officer of the same sex.", "Only a Superintendent may be present.", "Religious items can never be removed even where the statutory test is met."], "answer": 1, "explanation": "The religious-sensitivities Keynote says that where removal is required, it should where practicable occur out of public view and in the presence of an officer of the same sex.", "reference": "Code A Keynote 3.1.4.12 • Blackstone GPD 2023 Stop & Search p. 14"}, {"id": 42, "topic": "Stop & Search — PACE Code A", "question": "An Inspector is briefing officers on the meaning of 'dangerous instruments' for section 60 purposes. What does the supplied text mean by 'dangerous instruments'?", "options": ["Only firearms.", "Instruments which have a blade or are sharply pointed.", "All offensive weapons and any object capable of harm.", "Controlled drugs."], "answer": 1, "explanation": "The section 60 material defines dangerous instruments as instruments which have a blade or are sharply pointed. Offensive weapons are a separate category in the statutory wording.", "reference": "CJPOA 1994 s.60; Keynote 3.1.4.7 • Blackstone GPD 2023 Stop & Search pp. 10-11"}, {"id": 43, "topic": "Stop & Search — PACE Code A", "question": "A constable is considering one of the specified Schedule 5 TPIM search powers. Do those powers always require reasonable grounds to suspect that the individual is contravening the TPIM or carrying the item sought?", "options": ["No. The supplied Code A text states that the specified TPIM powers do not require reasonable grounds of suspicion in the way ordinary suspicion-based powers do.", "Yes, and the suspicion must be confirmed by an Inspector.", "Yes, but only in private premises.", "Yes, but only for persons under 18."], "answer": 0, "explanation": "The TPIM section explains that the specified Schedule 5 powers may be exercised without the ordinary reasonable-suspicion requirement.", "reference": "TPIM Act 2011 Sch.5; Code A 2.18A-2.20 • Blackstone GPD 2023 Stop & Search p. 15"}, {"id": 44, "topic": "Stop & Search — PACE Code A", "question": "A search warrant is issued under the TPIM Schedule 5 warrant provision described in Code A 2.20. Within what period must the search be carried out?", "options": ["24 hours.", "Seven days from issue.", "28 days.", "Three months."], "answer": 1, "explanation": "Code A 2.20 states that a search under that warrant must be carried out within seven days of issue.", "reference": "TPIM Act 2011 Sch.5; Code A 2.20 • Blackstone GPD 2023 Stop & Search p. 15"}, {"id": 45, "topic": "Stop & Search — PACE Code A", "question": "Under the same TPIM warrant provision, an officer is checking how often the individual may be searched. How many times may the individual be searched under that warrant within its validity period?", "options": ["Once.", "Twice.", "Unlimited times.", "Once per day."], "answer": 0, "explanation": "The supplied text states that the individual may be searched on one occasion only within the warrant period.", "reference": "TPIM Act 2011 Sch.5; Code A 2.20 • Blackstone GPD 2023 Stop & Search p. 15"}, {"id": 46, "topic": "Stop & Search — PACE Code A", "question": "An officer is recording the self-defined ethnicity of a person searched. Which Annex B code corresponds to 'White - British'?", "options": ["W1.", "M1.", "A1.", "B1."], "answer": 0, "explanation": "Annex B lists 'White - British' as W1.", "reference": "Code A Annex B • Blackstone GPD 2023 Stop & Search Annex B, p. 25"}, {"id": 47, "topic": "Stop & Search — PACE Code A", "question": "A designated Community Support Officer has lawfully detained a person under the Police Reform Act 2002 powers shown in Annex C. For what may the designated CSO search the detained person without consent under the relevant Schedule 4 power?", "options": ["Any controlled drugs.", "Objects that might be used to cause physical injury or to assist escape.", "Evidence of any offence whatsoever.", "Documents proving identity only."], "answer": 1, "explanation": "Annex C identifies the designated CSO power to search a lawfully detained person for objects that might cause physical injury or assist escape.", "reference": "Police Reform Act 2002 Sch.4; Code A Annex C • Blackstone GPD 2023 Stop & Search Annex C, p. 25"}, {"id": 48, "topic": "Stop & Search — PACE Code A", "question": "An officer is considering a search under section 4 Crossbows Act 1987. Which description matches the Annex A entry?", "options": ["Crossbows or parts of crossbows, subject to the statutory description, with the power exercisable anywhere except dwellings.", "Only knives carried by persons under 18.", "Only air weapons in public places.", "Only bows carried at sporting events."], "answer": 0, "explanation": "Annex A lists Crossbows Act 1987 s.4 for crossbows or parts of crossbows, subject to the statutory description in the table, and states the power is exercisable anywhere except dwellings.", "reference": "Crossbows Act 1987 s.4; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 25"}, {"id": 49, "topic": "Stop & Search — PACE Code A", "question": "Police are exercising the Protection of Badgers Act 1992 search power listed in Annex A. Where does the Annex A table state the power is exercisable?", "options": ["In a public place only.", "Anywhere.", "Anywhere except dwellings.", "Only on Crown land."], "answer": 1, "explanation": "Annex A lists the Protection of Badgers Act search power as exercisable anywhere.", "reference": "Protection of Badgers Act 1992; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 25"}, {"id": 50, "topic": "Stop & Search — PACE Code A", "question": "Police are exercising the Wildlife and Countryside Act 1981 search power listed in Annex A. Where does the Annex A table state the power is exercisable?", "options": ["Anywhere except dwellings.", "In public places only.", "Inside dwellings only.", "Only in national parks."], "answer": 0, "explanation": "Annex A lists the Wildlife and Countryside Act search power as exercisable anywhere except dwellings.", "reference": "Wildlife and Countryside Act 1981; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 25"}],SHEET="<PARSED TEXT FOR PAGE: 1 / 3>\nSTOP & SEARCH - PACE CODE A\nInspector Revision - condensed learning sheet\nMANUAL: GENERAL POLICE DUTIES | TOPIC: STOP & SEARCH | GP-SA-01\nMEMORY SPINE POWER -> GROUNDS -> OBJECT -> GOWISELY -> SEARCH -> RECORD -> SUPERVISE\n1. What Code A is doing\nCode A governs the exercise of statutory stop-and-search powers and the recording of public encounters. The supplied \nmanual stresses fair, responsible use, respect, non-discrimination and the need to minimise embarrassment. A stop and \nsearch is an investigative power - not a general power to stop people merely to find out what they are doing.\nCORE EXAM IDEA Always identify the statutory power first. Then ask: what may be searched for, where can the \npower be exercised, and what grounds/authorisation are required?\n2. Reasonable grounds for suspicion\n Reasonable suspicion must have an objective basis in facts, information and/or intelligence relevant to the likelihood \nthat the person has the article concerned.\n The officer must genuinely suspect the object will be found AND there must be an objective basis on which a \nreasonable person could reach the same conclusion.\n Personal factors can NEVER support reasonable suspicion: physical appearance or protected characteristics, previous \nconvictions, or generalisations/stereotypes about groups.\n Behaviour, time and location may contribute, but a hunch or instinct unsupported by an objective basis cannot.\n Information/intelligence can support suspicion, including descriptions and current intelligence, but targeting must still\nbe based on an objective connection to the article/offence.\n Membership of a group is not, by itself, enough. Group-related intelligence must give an objective basis relevant to the \nparticular search.\nEXAM TRAP 'Known offender', 'looks suspicious', ethnicity, age, clothing style or presence in a high-crime area alone \ndo NOT create reasonable grounds.\n3. Questioning before deciding to search\nAn officer with reasonable grounds may detain the person to carry out the search. Before doing so, the officer may ask \nquestions about behaviour or presence in circumstances giving rise to suspicion. A satisfactory explanation may dispel \nsuspicion; questioning may also reveal grounds relating to a different article. A person cannot be detained merely to \nobtain grounds through questioning.\n4. Section 60 CJPOA 1994 - suspicionless search\n An Inspector or above may authorise stop and search under s60 where the statutory conditions concerning serious \nviolence or dangerous instruments/offensive weapons are met.\n The authorisation is geographically and temporally limited and must specify the grounds, locality and period.\n The supplied manual states the initial authorisation period is up to 24 hours. It may be extended by Superintendent or \nabove for a further period up to 24 hours where the statutory continuation conditions are met.\n Under s60, the individual officer does not need reasonable grounds to suspect the particular person is carrying the \narticle, but the search must still be exercised lawfully, fairly and in accordance with Code A.\n Where s60 is in force, officers may search persons/vehicles for offensive weapons or dangerous instruments; the Code \nalso covers removal of face coverings where the relevant statutory power applies.\n<PARSED TEXT FOR PAGE: 2 / 3>\nRANK / CLOCK Initial s60: Inspector+ | up to 24h. Extension: Superintendent+ | further up to 24h.\n5. Conduct of the search\n Stops and searches must be carried out with courtesy, consideration and respect.\n Detention for search must be kept to the minimum necessary. The search should be at or near the place where the \nperson/vehicle was first detained.\n The extent of the search must be proportionate to the object sought. Do not search places where the object could not \nreasonably be concealed.\n In public, an officer may generally require removal only of outer coat, jacket and gloves. More thorough searches \ninvolving removal of more clothing are subject to additional safeguards and privacy requirements.\n Searches exposing intimate parts are not ordinary stop-and-search procedure; the manual directs such searches into \nthe separate safeguards in Code A/Code C.\n Where practicable, searches involving removal of headgear or other articles worn for religious reasons should be \nconducted out of public view by an officer of the same sex.\n Reasonable force may be used only where the underlying power permits it and where necessary.\n6. Before the search - the information that must be given\nBefore a detained person or vehicle is searched, the officer must take reasonable steps to give the required information. \nLearn this as the practical GOWISELY sequence:\nTrigger What the person needs\nG - Grounds The grounds for the search, where reasonable suspicion is\nrequired.\nO - Object What article/object the officer is searching for.\nW - Warrant card If not in uniform, show warrant card; the manual also \naddresses identity safeguards.\nI - Identity Officer's name/identification details as required.\nS - Station The police station to which the officer is attached.\nE - Entitlement Entitlement to a copy of the search record.\nL - Legal power The statutory power being used.\nY - 'You are detained' Make clear that the person is detained for the purpose of \nthe search.\nEXAM TRAP GOWISELY is a memory aid, not the statutory wording. In an exam, identify the actual Code A \nrequirement/power rather than treating the acronym itself as law.\n7. Recording requirements\n A record must be made as soon as practicable after a search to which Code A applies.\n The record includes core details such as the officer identity (subject to permitted safeguards), date/time/place, \nperson/vehicle searched, object of search, legal power, grounds where applicable, outcome and whether anything was \nfound/seized.\n If the person is arrested following the search, the search record may form part of the custody record.\n Where the person is not arrested, they are entitled to a copy of the record; the supplied material describes routes for \nobtaining the record where it cannot be provided immediately.\n<PARSED TEXT FOR PAGE: 3 / 3>\n The Code requires self-defined ethnicity to be recorded in the prescribed way; officer-perceived ethnicity is separately \nrecorded where required.\n8. Monitoring and supervision\n Supervisors must monitor the use of stop-and-search powers, scrutinise records and address misuse or \ndisproportionate patterns.\n Supervisors should consider whether reasonable suspicion is properly recorded and whether officers are using \npowers fairly and lawfully.\n Complaints or apparent misuse require appropriate supervisory action. The manual emphasises public confidence and\ncommunity relations as part of proper use of the power.\n9. Powers table - what to distinguish\nPower Object Who/what Where\nPACE s1 Stolen or prohibited articles Persons & vehicles Public place / statutory \nextent\nMDA 1971 s23 Controlled drugs Persons & vehicles Anywhere\nFirearms Act 1968 s47 Firearms / ammunition in \nstatutory circumstances\nPersons & vehicles Statutory extent\nCJPOA 1994 s60 Offensive weapons / \ndangerous instruments\nPersons & vehicles Authorised locality\nOther listed powers e.g. wildlife, poaching, \ncrossbows, sporting-event \nand TPIM powers\nVaries Varies by statute\n10. High-yield retrieval\n What two things are needed for reasonable suspicion?\n Name three things that can never, by themselves, create reasonable suspicion.\n What is different about s60 from an ordinary reasonable-suspicion search?\n Who can initially authorise s60, and for how long?\n Who can extend s60, and for how long?\n What is the purpose of GOWISELY?\n How far may a search go? What controls its extent?\n What extra safeguards apply to removal of more than outer coat/jacket/gloves?\n What must happen to the search record?\n What is the supervisor's role in Code A?\nSource: supplied Stop & Search manual pages (PACE Code A chapter and annex material). Condensed for Inspector exam retrieval.",VISUAL="<PARSED TEXT FOR PAGE: 1 / 1>\nSTOP & SEARCH - CODE A\nCONNOR-STYLE VISUAL MEMORY MAP\nGP-SA-02 | POWER -> GROUNDS -> GOWISELY -> SEARCH -> RECORD\n1 POWER 2 GROUNDS 3 OBJECT 4 GOWISELY 5 SEARCH 6 RECORD\nREASONABLE SUSPICION\n• GENUINE suspicion + OBJECTIVE basis\n• Facts / information / intelligence\n• Behaviour/time/place can contribute\n• NO: stereotypes, protected traits, convictions alone\n• Hunch alone = NOT enough\nSECTION 60\n• NO individual reasonable suspicion\n• Inspector+ authorises\n• Serious violence / dangerous instruments context\n• Initial: up to 24 HOURS\n• Superintendent+ may extend: further up to 24 HOURS\nGOWISELY\n• G Grounds\n• O Object\n• W Warrant card\n• I Identity\n• S Station\n• E Entitlement to record\n• L Legal power\n• Y You are detained\nSEARCH LIMITS\n• Minimum detention necessary\n• At/near place first detained\n• Only where OBJECT could be concealed\n• Public: normally outer coat/jacket/gloves\n• More clothing = extra safeguards/privacy\nRECORD\n• As soon as practicable\n• Power + object + grounds (if required)\n• Date/time/place + officer + person/vehicle\n• Outcome / found / seized\n• Arrest after search -> may form custody record\nSUPERVISE\n• Scrutinise reasonable grounds\n• Look for misuse/disproportionality\n• Act on complaints or patterns\n• Public confidence matters\n• Fair, responsible, respectful use\nEXAM TRAP 1\nHigh-crime area + previous convictions still do NOT automatically = \nreasonable grounds.\nEXAM TRAP 2\ns60 removes individual suspicion requirement - it does NOT remove \nCode A fairness/limits.\nEXAM TRAP 3\nSearch extent follows the OBJECT. If it cannot be hidden there, don't \nsearch there.\nCOVER THE PAGE: Power? • Grounds? • Object? • GOWISELY? • Search limits? • Record? • s60 rank + clock?\nSource: supplied Stop & Search manual pages • Inspector Revision • Code A Visual Memory Map",$=s=>document.querySelector(s),K='compass.v3';let st=JSON.parse(localStorage.getItem(K)||'null')||{a:0,c:0,b:[]},ss={l:[],i:0,s:null,r:false};function save(){localStorage.setItem(K,JSON.stringify(st))}function e(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function sh(c,t='home'){return `<header><div class=brand>Inspector's Compass<small>2023 source-checked revision</small></div></header><main>${c}</main><nav>${[['home','⌂ Home'],['learn','▤ Learn'],['quiz','✓ Quiz'],['saved','★ Saved']].map(x=>`<button class="${t==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</nav>`}function home(){let p=st.a?Math.round(st.c/st.a*100):0;return sh(`<p class=gold>INSPECTOR EXAM</p><h1>Know it. Retrieve it.<br>Use it under pressure.</h1><p class=muted>Verified questions and recovered worksheets.</p><button class=primary onclick="quiz()">Start 5-question drill →</button><div class=stats><div><strong>${st.a}</strong>Answered</div><div><strong>${p}%</strong>Accuracy</div><div><strong>${st.b.length}</strong>Saved</div></div><h2>Revision areas</h2><div class=card><b>Stop & Search — PACE Code A</b><p class=muted>50 source-checked questions</p></div>`,'home')}function learn(){return sh(`<h1>Learn</h1><div class=card><p class=gold>CONDENSED SHEET</p><h2>Stop & Search — Code A</h2><button class=primary onclick="sheet(0)">Open revision sheet</button></div><div class=card><p class=gold>VISUAL MEMORY MAP</p><h2>Power → Grounds → GOWISELY → Search → Record</h2><button class=primary onclick="sheet(1)">Open visual map</button></div>`,'learn')}function sheet(v){$('#app').innerHTML=sh(`<button onclick="go('learn')">‹ Back</button><h1>${v?'Visual memory map':'Revision sheet'}</h1><div class=sheet>${e(v?VISUAL:SHEET)}</div><button class=primary onclick=quiz()>Test me now →</button>`,'learn');scrollTo(0,0)}function quiz(list=Q){ss={l:[...list].sort(()=>Math.random()-.5).slice(0,5),i:0,s:null,r:false};rq()}function rq(){if(ss.i>=ss.l.length)return fin();let q=ss.l[ss.i];$('#app').innerHTML=sh(`<button onclick="go('home')">‹ Exit</button><span style="float:right">${ss.i+1} / ${ss.l.length}</span><p class=gold>${e(q.topic)}</p><button class=star onclick="bm(${q.id})">★</button><h2>${e(q.question)}</h2>${q.options.map((o,i)=>`<button class="answer ${ss.r?(i==q.answer?'correct':i==ss.s?'wrong':''):''}" onclick="pick(${i})" ${ss.r?'disabled':''}>${String.fromCharCode(65+i)}. ${e(o)}</button>`).join('')}${ss.r?`<div class=explain><b>${ss.s==q.answer?'Correct':'Not quite'}</b><p>${e(q.explanation)}</p><small>${e(q.reference)}</small></div><button class=primary onclick=next()>Next →</button>`:`<button class=primary onclick=check()>Check answer</button>`}`,'quiz')}function pick(i){ss.s=i;rq()}function check(){if(ss.s===null)return;let q=ss.l[ss.i];ss.r=true;st.a++;if(ss.s==q.answer)st.c++;save();rq()}function next(){ss.i++;ss.s=null;ss.r=false;rq()}function fin(){$('#app').innerHTML=sh(`<h1>Drill complete.</h1><button class=primary onclick=quiz()>Another 5</button>`,'quiz')}function bm(id){st.b=st.b.includes(id)?st.b.filter(x=>x!=id):[...st.b,id];save();rq()}function saved(){let a=Q.filter(q=>st.b.includes(q.id));return sh(`<h1>Saved</h1>${a.length?a.map(q=>`<div class=card>${e(q.question)}<p class=muted>${e(q.reference)}</p></div>`).join('')+`<button class=primary onclick="quiz(Q.filter(q=>st.b.includes(q.id)))">Drill saved</button>`:'<p class=muted>No saved questions yet.</p>'}`,'saved')}function go(p){$('#app').innerHTML=p=='home'?home():p=='learn'?learn():p=='saved'?saved():home();scrollTo(0,0)}$('#app').innerHTML=home();</script></body></html>
