"},{"id":99,"topic":"Detention & Interviews — PACE Code C","question":"Accredited independent custody visitors arrive without prior notice and ask to inspect custody conditions and speak privately with consenting detainees.\n\nWhich general principle applies?","options":["All visits need 24 hours advance inspector permission.","Their statutory independent visiting scheme allows unannounced custody visits and confidential conversations with consenting detainees, subject to lawful scheme restrictions.","They may inspect empty cells but never approach detainees.","They may visit only in ordinary office hours."],"answer":1,"explanation":"The statutory independent custody visiting scheme under Police Reform Act s51 provides independent visits and rights of access under its code; the original Gemini citation to Code C Note 3D requires closer checking.","reference":"Police Reform Act 2002 s51; Independent Custody Visiting Code of Practice"},{"id":100,"topic":"Detention & Interviews — PACE Code C","question":"A former detainee requests a copy of their custody record eight months after release.\n\nWhat does Code C provide?","options":["The entitlement expires when the detainee physically leaves custody.","The detainee or their representative is entitled, on request, to a copy as soon as practicable within the 12-month post-release window.","A copy is available only after trial.","A court order is required for every copy request."],"answer":1,"explanation":"Code C 2.4A entitles a detainee, legal representative or appropriate adult to a copy on request when leaving detention or attending court and for twelve months after release.","reference":"Code C 2.4A"}],SHEET="<PARSED TEXT FOR PAGE: 1 / 3>\nSTOP & SEARCH - PACE CODE A\nInspector Revision - condensed learning sheet\nMANUAL: GENERAL POLICE DUTIES | TOPIC: STOP & SEARCH | GP-SA-01\nMEMORY SPINE POWER -> GROUNDS -> OBJECT -> GOWISELY -> SEARCH -> RECORD -> SUPERVISE\n1. What Code A is doing\nCode A governs the exercise of statutory stop-and-search powers and the recording of public encounters. The supplied \nmanual stresses fair, responsible use, respect, non-discrimination and the need to minimise embarrassment. A stop and \nsearch is an investigative power - not a general power to stop people merely to find out what they are doing.\nCORE EXAM IDEA Always identify the statutory power first. Then ask: what may be searched for, where can the \npower be exercised, and what grounds/authorisation are required?\n2. Reasonable grounds for suspicion\n Reasonable suspicion must have an objective basis in facts, information and/or intelligence relevant to the likelihood \nthat the person has the article concerned.\n The officer must genuinely suspect the object will be found AND there must be an objective basis on which a \nreasonable person could reach the same conclusion.\n Personal factors can NEVER support reasonable suspicion: physical appearance or protected characteristics, previous \nconvictions, or generalisations/stereotypes about groups.\n Behaviour, time and location may contribute, but a hunch or instinct unsupported by an objective basis cannot.\n Information/intelligence can support suspicion, including descriptions and current intelligence, but targeting must still\nbe based on an objective connection to the article/offence.\n Membership of a group is not, by itself, enough. Group-related intelligence must give an objective basis relevant to the \nparticular search.\nEXAM TRAP 'Known offender', 'looks suspicious', ethnicity, age, clothing style or presence in a high-crime area alone \ndo NOT create reasonable grounds.\n3. Questioning before deciding to search\nAn officer with reasonable grounds may detain the person to carry out the search. Before doing so, the officer may ask \nquestions about behaviour or presence in circumstances giving rise to suspicion. A satisfactory explanation may dispel \nsuspicion; questioning may also reveal grounds relating to a different article. A person cannot be detained merely to \nobtain grounds through questioning.\n4. Section 60 CJPOA 1994 - suspicionless search\n An Inspector or above may authorise stop and search under s60 where the statutory conditions concerning serious \nviolence or dangerous instruments/offensive weapons are met.\n The authorisation is geographically and temporally limited and must specify the grounds, locality and period.\n The supplied manual states the initial authorisation period is up to 24 hours. It may be extended by Superintendent or \nabove for a further period up to 24 hours where the statutory continuation conditions are met.\n Under s60, the individual officer does not need reasonable grounds to suspect the particular person is carrying the \narticle, but the search must still be exercised lawfully, fairly and in accordance with Code A.\n Where s60 is in force, officers may search persons/vehicles for offensive weapons or dangerous instruments; the Code \nalso covers removal of face coverings where the relevant statutory power applies.\n<PARSED TEXT FOR PAGE: 2 / 3>\nRANK / CLOCK Initial s60: Inspector+ | up to 24h. Extension: Superintendent+ | further up to 24h.\n5. Conduct of the search\n Stops and searches must be carried out with courtesy, consideration and respect.\n Detention for search must be kept to the minimum necessary. The search should be at or near the place where the \nperson/vehicle was first detained.\n The extent of the search must be proportionate to the object sought. Do not search places where the object could not \nreasonably be concealed.\n In public, an officer may generally require removal only of outer coat, jacket and gloves. More thorough searches \ninvolving removal of more clothing are subject to additional safeguards and privacy requirements.\n Searches exposing intimate parts are not ordinary stop-and-search procedure; the manual directs such searches into \nthe separate safeguards in Code A/Code C.\n Where practicable, searches involving removal of headgear or other articles worn for religious reasons should be \nconducted out of public view by an officer of the same sex.\n Reasonable force may be used only where the underlying power permits it and where necessary.\n6. Before the search - the information that must be given\nBefore a detained person or vehicle is searched, the officer must take reasonable steps to give the required information. \nLearn this as the practical GOWISELY sequence:\nTrigger What the person needs\nG - Grounds The grounds for the search, where reasonable suspicion is\nrequired.\nO - Object What article/object the officer is searching for.\nW - Warrant card If not in uniform, show warrant card; the manual also \naddresses identity safeguards.\nI - Identity Officer's name/identification details as required.\nS - Station The police station to which the officer is attached.\nE - Entitlement Entitlement to a copy of the search record.\nL - Legal power The statutory power being used.\nY - 'You are detained' Make clear that the person is detained for the purpose of \nthe search.\nEXAM TRAP GOWISELY is a memory aid, not the statutory wording. In an exam, identify the actual Code A \nrequirement/power rather than treating the acronym itself as law.\n7. Recording requirements\n A record must be made as soon as practicable after a search to which Code A applies.\n The record includes core details such as the officer identity (subject to permitted safeguards), date/time/place, \nperson/vehicle searched, object of search, legal power, grounds where applicable, outcome and whether anything was \nfound/seized.\n If the person is arrested following the search, the search record may form part of the custody record.\n Where the person is not arrested, they are entitled to a copy of the record; the supplied material describes routes for \nobtaining the record where it cannot be provided immediately.\n<PARSED TEXT FOR PAGE: 3 / 3>\n The Code requires self-defined ethnicity to be recorded in the prescribed way; officer-perceived ethnicity is separately \nrecorded where required.\n8. Monitoring and supervision\n Supervisors must monitor the use of stop-and-search powers, scrutinise records and address misuse or \ndisproportionate patterns.\n Supervisors should consider whether reasonable suspicion is properly recorded and whether officers are using \npowers fairly and lawfully.\n Complaints or apparent misuse require appropriate supervisory action. The manual emphasises public confidence and\ncommunity relations as part of proper use of the power.\n9. Powers table - what to distinguish\nPower Object Who/what Where\nPACE s1 Stolen or prohibited articles Persons & vehicles Public place / statutory \nextent\nMDA 1971 s23 Controlled drugs Persons & vehicles Anywhere\nFirearms Act 1968 s47 Firearms / ammunition in \nstatutory circumstances\nPersons & vehicles Statutory extent\nCJPOA 1994 s60 Offensive weapons / \ndangerous instruments\nPersons & vehicles Authorised locality\nOther listed powers e.g. wildlife, poaching, \ncrossbows, sporting-event \nand TPIM powers\nVaries Varies by statute\n10. High-yield retrieval\n What two things are needed for reasonable suspicion?\n Name three things that can never, by themselves, create reasonable suspicion.\n What is different about s60 from an ordinary reasonable-suspicion search?\n Who can initially authorise s60, and for how long?\n Who can extend s60, and for how long?\n What is the purpose of GOWISELY?\n How far may a search go? What controls its extent?\n What extra safeguards apply to removal of more than outer coat/jacket/gloves?\n What must happen to the search record?\n What is the supervisor's role in Code A?\nSource: supplied Stop & Search manual pages (PACE Code A chapter and annex material). Condensed for Inspector exam retrieval.",VISUAL="<PARSED TEXT FOR PAGE: 1 / 1>\nSTOP & SEARCH - CODE A\nCONNOR-STYLE VISUAL MEMORY MAP\nGP-SA-02 | POWER -> GROUNDS -> GOWISELY -> SEARCH -> RECORD\n1 POWER 2 GROUNDS 3 OBJECT 4 GOWISELY 5 SEARCH 6 RECORD\nREASONABLE SUSPICION\n• GENUINE suspicion + OBJECTIVE basis\n• Facts / information / intelligence\n• Behaviour/time/place can contribute\n• NO: stereotypes, protected traits, convictions alone\n• Hunch alone = NOT enough\nSECTION 60\n• NO individual reasonable suspicion\n• Inspector+ authorises\n• Serious violence / dangerous instruments context\n• Initial: up to 24 HOURS\n• Superintendent+ may extend: further up to 24 HOURS\nGOWISELY\n• G Grounds\n• O Object\n• W Warrant card\n• I Identity\n• S Station\n• E Entitlement to record\n• L Legal power\n• Y You are detained\nSEARCH LIMITS\n• Minimum detention necessary\n• At/near place first detained\n• Only where OBJECT could be concealed\n• Public: normally outer coat/jacket/gloves\n• More clothing = extra safeguards/privacy\nRECORD\n• As soon as practicable\n• Power + object + grounds (if required)\n• Date/time/place + officer + person/vehicle\n• Outcome / found / seized\n• Arrest after search -> may form custody record\nSUPERVISE\n• Scrutinise reasonable grounds\n• Look for misuse/disproportionality\n• Act on complaints or patterns\n• Public confidence matters\n• Fair, responsible, respectful use\nEXAM TRAP 1\nHigh-crime area + previous convictions still do NOT automatically = \nreasonable grounds.\nEXAM TRAP 2\ns60 removes individual suspicion requirement - it does NOT remove \nCode A fairness/limits.\nEXAM TRAP 3\nSearch extent follows the OBJECT. If it cannot be hidden there, don't \nsearch there.\nCOVER THE PAGE: Power? • Grounds? • Object? • GOWISELY? • Search limits? • Record? • s60 rank + clock?\nSource: supplied Stop & Search manual pages • Inspector Revision • Code A Visual Memory Map",$=s=>document.querySelector(s),K='compass.v4';let st=JSON.parse(localStorage.getItem(K)||'null')||{a:0,c:0,b:[]},ss={l:[],i:0,s:null,r:false};function save(){localStorage.setItem(K,JSON.stringify(st))}function e(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function sh(c,t='home'){return `<header><div class=brand>Inspector's Compass<small>2023 source-checked revision</small></div></header><main>${c}</main><nav>${[['home','⌂ Home'],['learn','▤ Learn'],['quiz','✓ Quiz'],['saved','★ Saved']].map(x=>`<button class="${t==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</nav>`}function home(){let p=st.a?Math.round(st.c/st.a*100):0;return sh(`<p class=gold>INSPECTOR EXAM</p><h1>Know it. Retrieve it.<br>Use it under pressure.</h1><p class=muted>100 verified questions, learning sheets and exam-plan revision.</p><button class=primary onclick="quiz()">Start 5-question drill →</button><div class=stats><div><strong>${st.a}</strong>Answered</div><div><strong>${p}%</strong>Accuracy</div><div><strong>${st.b.length}</strong>Saved</div></div><h2>Revision areas</h2><div class=card><b>Stop & Search — PACE Code A</b><p class=muted>50 source-checked questions</p><button class=primary onclick="quiz(Q.filter(q=>q.topic.includes('Code A')))">Drill Code A</button></div>
<div class=card><b>Detention & Interviews — PACE Code C</b><p class=muted>50 source-checked questions</p><button class=primary onclick="quiz(Q.filter(q=>q.topic.includes('Code C')))">Drill Code C</button></div>
<div class=card><b>Mixed PACE drill</b><p class=muted>Random questions across both verified banks</p><button class=primary onclick="quiz(Q)">Start mixed drill</button></div>`,'home')}function learn(){return sh(`<h1>Learn</h1><div class=card><p class=gold>REVISION PLAN</p><h2>Exam sprint</h2><p>PACE foundations → evidence & investigation → core criminal law → procedure & police powers → consolidation → final recall.</p><p class=muted>Normal session: 20 min read • 15 min questions • 5 min recall. Difficult shift: 5 min reading + 5 questions.</p></div><div class=card><p class=gold>CONDENSED SHEET</p><h2>Stop & Search — Code A</h2><button class=primary onclick="sheet(0)">Open revision sheet</button></div><div class=card><p class=gold>VISUAL MEMORY MAP</p><h2>Power → Grounds → GOWISELY → Search → Record</h2><button class=primary onclick="sheet(1)">Open visual map</button></div>`,'learn')}function sheet(v){$('#app').innerHTML=sh(`<button onclick="go('learn')">‹ Back</button><h1>${v?'Visual memory map':'Revision sheet'}</h1><div class=sheet>${e(v?VISUAL:SHEET)}</div><button class=primary onclick=quiz()>Test me now →</button>`,'learn');scrollTo(0,0)}function quiz(list=Q){ss={l:[...list].sort(()=>Math.random()-.5).slice(0,5),i:0,s:null,r:false};rq()}function rq(){if(ss.i>=ss.l.length)return fin();let q=ss.l[ss.i];$('#app').innerHTML=sh(`<button onclick="go('home')">‹ Exit</button><span style="float:right">${ss.i+1} / ${ss.l.length}</span><p class=gold>${e(q.topic)}</p><button class=star onclick="bm(${q.id})">★</button><h2>${e(q.question)}</h2>${q.options.map((o,i)=>`<button class="answer ${ss.r?(i==q.answer?'correct':i==ss.s?'wrong':''):''}" onclick="pick(${i})" ${ss.r?'disabled':''}>${String.fromCharCode(65+i)}. ${e(o)}</button>`).join('')}${ss.r?`<div class=explain><b>${ss.s==q.answer?'Correct':'Not quite'}</b><p>${e(q.explanation)}</p><small>${e(q.reference)}</small></div><button class=primary onclick=next()>Next →</button>`:`<button class=primary onclick=check()>Check answer</button>`}`,'quiz')}function pick(i){ss.s=i;rq()}function check(){if(ss.s===null)return;let q=ss.l[ss.i];ss.r=true;st.a++;if(ss.s==q.answer)st.c++;save();rq()}function next(){ss.i++;ss.s=null;ss.r=false;rq()}function fin(){$('#app').innerHTML=sh(`<h1>Drill complete.</h1><button class=primary onclick=quiz()>Another 5</button>`,'quiz')}function bm(id){st.b=st.b.includes(id)?st.b.filter(x=>x!=id):[...st.b,id];save();rq()}function saved(){let a=Q.filter(q=>st.b.includes(q.id));return sh(`<h1>Saved</h1>${a.length?a.map(q=>`<div class=card>${e(q.question)}<p class=muted>${e(q.reference)}</p></div>`).join('')+`<button class=primary onclick="quiz(Q.filter(q=>st.b.includes(q.id)))">Drill saved</button>`:'<p class=muted>No saved questions yet.</p>'}`,'saved')}function go(p){$('#app').innerHTML=p=='home'?home():p=='learn'?learn():p=='saved'?saved():home();scrollTo(0,0)}$('#app').innerHTML=home();</script></body></html>
