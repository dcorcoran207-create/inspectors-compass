<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Inspector's Compass</title><style>*{box-sizing:border-box}body{margin:0;background:#071421;color:#f5f7fa;font-family:system-ui;padding-bottom:80px}header{position:sticky;top:0;background:#06111d;border-bottom:1px solid #203b55;padding:16px 20px;z-index:3}.brand{font-weight:800}.brand small{display:block;color:#a9b7c8}main{max-width:760px;margin:auto;padding:24px 20px}h1{font-size:38px}.gold{color:#edbd4f;font-weight:800}.muted{color:#a9b7c8}.primary,.card,.answer{width:100%;border-radius:18px;padding:17px;margin:7px 0;border:1px solid #203b55}.primary{background:#edbd4f;color:#17202a;font-weight:800;text-align:center}.card,.answer{background:#102235;color:#f5f7fa}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats div{background:#102235;border:1px solid #203b55;border-radius:18px;padding:15px;text-align:center}.stats strong{display:block;font-size:28px}nav{position:fixed;bottom:0;left:0;right:0;background:#091827;border-top:1px solid #203b55;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}nav button{background:none;border:0;color:#a9b7c8;padding:13px 3px}nav .active{color:#edbd4f}.sheet{white-space:pre-wrap;line-height:1.55;background:#102235;border:1px solid #203b55;border-radius:18px;padding:18px}.answer{text-align:left}.correct{border-color:#2fbf71}.wrong{border-color:#d85b5b}.explain{background:#102235;border:1px solid #203b55;border-radius:18px;padding:18px}.star{float:right;background:none;border:0;color:#edbd4f;font-size:24px}</style></head><body><div id=app></div><script>const Q=[{"id": 1, "topic": "Stop & Search — PACE Code A", "question": "An Inspector is considering an initial section 60 authorisation after intelligence indicates rival groups may engage in serious violence in a town centre. Which statement correctly states the rank and one statutory route for an initial section 60 authorisation?", "options": ["Superintendent or above, on reasonable suspicion that violence may occur.", "Inspector or above, on reasonable belief that incidents involving serious violence may take place in a locality and that authorisation is expedient to prevent them.", "Sergeant or above, whenever offensive weapons might be present.", "Chief Inspector or above, but only after serious violence has already occurred."], "answer": 1, "explanation": "Code A 2.12-2.13 requires an officer of Inspector rank or above. One route is reasonable belief that incidents involving serious violence may take place in a locality and that it is expedient to give the authorisation to prevent them.", "reference": "CJPOA 1994 s.60; Code A 2.12-2.13 • Blackstone GPD 2023 Stop & Search pp. 9-10"}, {"id": 2, "topic": "Stop & Search — PACE Code A", "question": "A section 60 authorisation has been in force for 24 hours. Offences connected with the relevant activity have been committed and further use of the power appears necessary. Who may extend the authorisation, and for how long?", "options": ["Inspector or above, for a further 12 hours.", "Superintendent or above, for a further period not exceeding 24 hours.", "Chief Constable only, for a further 48 hours.", "Any officer who gave the original authorisation, for 24 hours."], "answer": 1, "explanation": "The supplied text states that an officer of Superintendent rank or above may extend a section 60 authorisation for a further period not exceeding 24 hours when the continuation conditions are met.", "reference": "CJPOA 1994 s.60; Code A / Keynote 3.1.4.10 • Blackstone GPD 2023 Stop & Search pp. 10-11"}, {"id": 3, "topic": "Stop & Search — PACE Code A", "question": "An Inspector gives an urgent section 60 authorisation orally. What must happen to the oral authorisation?", "options": ["It is invalid until a magistrate confirms it.", "It must be recorded in writing as soon as practicable, including the statutory particulars.", "It may remain oral for the whole authorised period.", "It must be confirmed by a Chief Inspector within one hour."], "answer": 1, "explanation": "Code A permits an oral authorisation in the specified circumstances, but it must be recorded in writing as soon as practicable with the required grounds, locality and period.", "reference": "CJPOA 1994 s.60; Code A 2.13 • Blackstone GPD 2023 Stop & Search pp. 9-11"}, {"id": 4, "topic": "Stop & Search — PACE Code A", "question": "A section 60 authorisation is in force in a defined locality. What is different about the grounds required for an individual search carried out under that authorisation?", "options": ["The searching constable must still have reasonable grounds to suspect that particular person.", "No individual reasonable suspicion is required, but the power must be exercised within the authorisation and Code A safeguards.", "The person must first consent.", "A Superintendent must approve each individual search."], "answer": 1, "explanation": "Section 60 is a suspicionless power once a valid authorisation is in force. The officer does not need reasonable grounds against the individual, but the authorisation and Code A limits still govern the search.", "reference": "CJPOA 1994 s.60; Code A 2.12 onwards • Blackstone GPD 2023 Stop & Search pp. 9-12"}, {"id": 5, "topic": "Stop & Search — PACE Code A", "question": "An officer believes a person may be carrying stolen property and is considering a section 1 PACE search. What two elements make up reasonable grounds for suspicion under the supplied Code A text?", "options": ["An honest suspicion and approval from a supervisor.", "A genuine suspicion in the officer's own mind and an objective basis for that suspicion.", "A previous conviction and presence in a high-crime area.", "A victim complaint and a refusal to answer questions."], "answer": 1, "explanation": "Code A describes a two-part test: the officer must genuinely suspect the object will be found and there must be an objective basis for that suspicion founded on facts, information or intelligence.", "reference": "PACE 1984 s.1; Code A 2.2 • Blackstone GPD 2023 Stop & Search pp. 5-6"}, {"id": 6, "topic": "Stop & Search — PACE Code A", "question": "An officer sees a person in an area associated with theft and recognises them as having previous convictions. Can previous convictions and general personal factors alone create reasonable grounds to search?", "options": ["Yes, if the officer knows the person has relevant convictions.", "Yes, if the area also has a high crime rate.", "No. Personal factors such as appearance or previous convictions cannot themselves provide the objective basis required.", "Only if a Sergeant agrees."], "answer": 2, "explanation": "The supplied Code A text states that reasonable suspicion can never be supported on personal factors alone; the officer needs an objective basis in current facts, information or intelligence.", "reference": "Code A 2.2A • Blackstone GPD 2023 Stop & Search p. 6"}, {"id": 7, "topic": "Stop & Search — PACE Code A", "question": "An officer has reliable current intelligence that a particular gang habitually carries knives at organised meetings. A person is objectively identifiable as a member of that gang and is attending such a meeting. How may the intelligence affect reasonable suspicion?", "options": ["It can never be relevant because group membership can never be considered.", "It may provide an objective basis for reasonable suspicion, subject to the specific Code A safeguards and the facts of the encounter.", "It automatically permits a strip search.", "It creates section 60 powers without an authorisation."], "answer": 1, "explanation": "Code A allows specific and reliable intelligence about a group or gang to contribute to reasonable suspicion where there is an objective connection between the person, the group and the prohibited articles.", "reference": "Code A 2.6-2.6A • Blackstone GPD 2023 Stop & Search pp. 6-7"}, {"id": 8, "topic": "Stop & Search — PACE Code A", "question": "An officer encounters a person whose behaviour, time and location appear unusual but has no other supporting facts. What does Code A say about a hunch or instinct?", "options": ["A hunch is enough if the officer has more than five years' service.", "A hunch alone cannot be justified as an objective basis for reasonable suspicion.", "A hunch is enough in a high-crime area.", "A hunch is enough if the search is brief."], "answer": 1, "explanation": "The supplied text makes clear that reasonable suspicion must have an objective basis; a hunch or instinct unsupported by objective grounds is insufficient.", "reference": "Code A 2.6B • Blackstone GPD 2023 Stop & Search p. 7"}, {"id": 9, "topic": "Stop & Search — PACE Code A", "question": "An officer has reasonable grounds to suspect a person but asks brief questions before deciding whether to search. What is the proper purpose of such questioning?", "options": ["To obtain a confession before searching.", "To clarify the person's behaviour or presence and potentially confirm or dispel the grounds for suspicion.", "To delay the person until a supervisor arrives.", "To create grounds where none existed by detaining the person for questioning."], "answer": 1, "explanation": "Code A 2.9 permits questions about behaviour or presence where reasonable grounds exist. Answers may confirm or dispel suspicion; a person must not be detained merely to find grounds through questioning.", "reference": "Code A 2.9 • Blackstone GPD 2023 Stop & Search pp. 7-8"}, {"id": 10, "topic": "Stop & Search — PACE Code A", "question": "A person gives a credible explanation which removes the factual basis for an officer's proposed search. What should the officer do?", "options": ["Search anyway because the officer had initially formed suspicion.", "Treat the explanation as irrelevant.", "Reassess the grounds; if suspicion is dispelled, the search should not proceed on the original basis.", "Arrest the person for refusing a search."], "answer": 2, "explanation": "Code A 2.9 recognises that preliminary questioning can dispel reasonable suspicion. If the objective basis disappears, the original search justification disappears with it.", "reference": "Code A 2.9 • Blackstone GPD 2023 Stop & Search pp. 7-8"}, {"id": 11, "topic": "Stop & Search — PACE Code A", "question": "An officer reasonably suspects that a pedestrian has stolen property concealed in a bag. Which power is the core statutory stop-and-search power for stolen or prohibited articles?", "options": ["PACE 1984 s.1.", "Misuse of Drugs Act 1971 s.23.", "Firearms Act 1968 s.47.", "CJPOA 1994 s.60 only."], "answer": 0, "explanation": "The Annex A table identifies PACE s.1 as the principal stop-and-search power for stolen or prohibited articles.", "reference": "PACE 1984 s.1; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, pp. 24-25"}, {"id": 12, "topic": "Stop & Search — PACE Code A", "question": "An officer reasonably suspects that a driver has controlled drugs in the vehicle. Which power in Annex A applies?", "options": ["PACE 1984 s.1 only.", "Misuse of Drugs Act 1971 s.23.", "Firearms Act 1968 s.47.", "CJPOA 1994 s.60."], "answer": 1, "explanation": "Annex A identifies Misuse of Drugs Act 1971 s.23 as the stop-and-search power for controlled drugs.", "reference": "Misuse of Drugs Act 1971 s.23; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 24"}, {"id": 13, "topic": "Stop & Search — PACE Code A", "question": "An officer has the statutory grounds to search for firearms. Which power in Annex A is the principal firearms stop-and-search power?", "options": ["PACE 1984 s.1.", "Firearms Act 1968 s.47.", "Misuse of Drugs Act 1971 s.23.", "Police Reform Act 2002 Sch.4."], "answer": 1, "explanation": "Annex A lists Firearms Act 1968 s.47 for firearms searches in the statutory circumstances described there.", "reference": "Firearms Act 1968 s.47; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 24"}, {"id": 14, "topic": "Stop & Search — PACE Code A", "question": "An officer is searching school premises for an offensive weapon or bladed/sharply pointed article. Which statutory power is listed in Annex A?", "options": ["Criminal Justice Act 1988 s.139B.", "Crossbows Act 1987 s.4.", "Poaching Prevention Act 1862 s.2.", "Protection of Badgers Act 1992 s.10."], "answer": 0, "explanation": "Annex A lists Criminal Justice Act 1988 s.139B for offensive weapons and bladed or sharply pointed articles on school premises.", "reference": "Criminal Justice Act 1988 s.139B; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 25"}, {"id": 15, "topic": "Stop & Search — PACE Code A", "question": "Police suspect a person in a public place of possessing game or poaching equipment in circumstances engaging the statutory power. Which Act is listed in Annex A?", "options": ["Poaching Prevention Act 1862 s.2.", "Deer Act 1991 s.12 only.", "Wildlife and Countryside Act 1981 s.19 only.", "Sporting Events (Control of Alcohol etc.) Act 1985 s.7."], "answer": 0, "explanation": "Annex A lists Poaching Prevention Act 1862 s.2 for game or poaching equipment, exercisable in a public place.", "reference": "Poaching Prevention Act 1862 s.2; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 25"}, {"id": 16, "topic": "Stop & Search — PACE Code A", "question": "An officer starts a standard public stop and search under section 1 PACE. What clothing may the officer require the person to remove in public under the ordinary Code A rule?", "options": ["Outer coat, jacket and gloves.", "Shirt, trousers and shoes.", "Any clothing if the officer is the same sex.", "Headgear, footwear and all outer clothing in every case."], "answer": 0, "explanation": "Code A 3.5 states that the ordinary power does not allow a person to be required to remove clothing in public other than an outer coat, jacket or gloves, subject to the separate statutory exceptions described in the text.", "reference": "Code A 3.5 • Blackstone GPD 2023 Stop & Search p. 16"}, {"id": 17, "topic": "Stop & Search — PACE Code A", "question": "An officer needs a more thorough search that requires removal of more than an outer coat, jacket or gloves. What safeguard applies?", "options": ["It may be done in public if a second officer is present.", "It must be conducted out of public view and by an officer of the same sex, subject to the Code's detailed rules.", "It may only be done by an Inspector.", "It always requires arrest first."], "answer": 1, "explanation": "Code A 3.6 requires a more thorough search involving removal of more clothing to be conducted out of public view and by an officer of the same sex, with the additional safeguards in the Code.", "reference": "Code A 3.6 • Blackstone GPD 2023 Stop & Search p. 16"}, {"id": 18, "topic": "Stop & Search — PACE Code A", "question": "An officer is searching for a tiny item that could reasonably be hidden in a person's hair. May the person's hair be searched in public?", "options": ["No, hair can never be searched during a public stop and search.", "Yes, where the object sought could reasonably be concealed there and the search is proportionate.", "Only after arrest.", "Only by a medical practitioner."], "answer": 1, "explanation": "Code A 3.5 says the extent of a search must depend on what is suspected of being carried and notes that a person's hair may be searched in public.", "reference": "Code A 3.3-3.5 • Blackstone GPD 2023 Stop & Search p. 16"}, {"id": 19, "topic": "Stop & Search — PACE Code A", "question": "An officer is searching for an item small enough to be concealed inside a coat pocket. Which principle controls how far the search may go?", "options": ["The officer may search every part of the person's clothing regardless of the object sought.", "The extent of the search must be reasonably related to where the object could be concealed.", "The search must always include removal of footwear.", "The search may never include putting hands inside pockets."], "answer": 1, "explanation": "Code A 3.3-3.5 links the extent of the search to the nature of the object sought. Officers may search places where it could reasonably be concealed and should not go further than necessary.", "reference": "Code A 3.3-3.5 • Blackstone GPD 2023 Stop & Search p. 16"}, {"id": 20, "topic": "Stop & Search — PACE Code A", "question": "A stop-and-search detention is taking longer than necessary because officers are waiting for paperwork that could be completed afterwards. Which Code A principle is engaged?", "options": ["Detention for search should be kept to the minimum necessary.", "Any stop and search may last up to six hours.", "Only a supervisor may decide when a search ends.", "The person must remain until a written record is printed."], "answer": 0, "explanation": "Code A states that detention for the purposes of a search must be kept to the minimum necessary and the search should normally take place at or near the place of the stop.", "reference": "Code A 1.2 and 3.4 • Blackstone GPD 2023 Stop & Search pp. 2, 16"}, {"id": 21, "topic": "Stop & Search — PACE Code A", "question": "Before searching a detained person, an officer gives the grounds and object but not their identity or station. Which statement is correct?", "options": ["That is sufficient because grounds and object are the only mandatory information.", "The officer must also provide the identity/station information required by Code A before the search, subject to the stated safety exception.", "Identity is required only after the search.", "Identity is required only if an arrest follows."], "answer": 1, "explanation": "Code A 3.8 requires specified information before the search, including the officer's identity details and police station, subject to the permitted exception where naming the officer creates a genuine risk.", "reference": "PACE 1984 s.2; Code A 3.8 • Blackstone GPD 2023 Stop & Search p. 17"}, {"id": 22, "topic": "Stop & Search — PACE Code A", "question": "An officer is about to carry out a section 1 PACE search. What must the person be told about the object of the search?", "options": ["Only that the officer is conducting a lawful search.", "The object of the search in terms of the article or articles being looked for.", "The maximum sentence for any offence discovered.", "The name of the custody officer."], "answer": 1, "explanation": "Code A 3.8 requires a clear explanation of the object of the search in terms of the article or articles for which there is a power to search.", "reference": "PACE 1984 s.2; Code A 3.8 • Blackstone GPD 2023 Stop & Search p. 17"}, {"id": 23, "topic": "Stop & Search — PACE Code A", "question": "An officer is not in uniform and intends to carry out a stop and search. What additional step is required before the search?", "options": ["Obtain written Inspector authority.", "Show their warrant card.", "Call a uniformed officer to conduct the search.", "Arrest the person first."], "answer": 1, "explanation": "Code A 3.8 requires an officer not in uniform to show their warrant card before the search.", "reference": "PACE 1984 s.2; Code A 3.8 • Blackstone GPD 2023 Stop & Search p. 17"}, {"id": 24, "topic": "Stop & Search — PACE Code A", "question": "A person is detained for a search under a statutory power requiring reasonable suspicion. What must the officer explain about the grounds?", "options": ["The officer need only say 'intelligence received'.", "The officer must explain the grounds for the search, not merely state the statutory power.", "The grounds can be withheld in every case.", "Grounds are required only if something is found."], "answer": 1, "explanation": "Code A 3.8 requires the grounds for the search to be explained where the power depends on reasonable suspicion.", "reference": "PACE 1984 s.2; Code A 3.8 • Blackstone GPD 2023 Stop & Search p. 17"}, {"id": 25, "topic": "Stop & Search — PACE Code A", "question": "A person is about to be searched and asks whether they can obtain a copy of the search record. What should the officer tell them?", "options": ["They have no entitlement unless arrested.", "They are entitled to the record in accordance with the Code and must be told how it can be obtained.", "Only their solicitor can obtain it.", "The record is confidential to police."], "answer": 1, "explanation": "Code A requires the person to be informed of their entitlement to a copy/access to the search record and the mechanism for obtaining it.", "reference": "PACE 1984 s.3; Code A 3.8 and 4.2 • Blackstone GPD 2023 Stop & Search pp. 17-20"}, {"id": 26, "topic": "Stop & Search — PACE Code A", "question": "A search does not result in arrest and making an immediate written record is wholly impracticable because of serious public disorder. When must the officer make the record?", "options": ["Only if the person later asks for one.", "As soon as practicable after the search.", "Within seven days.", "Before the end of the officer's next tour."], "answer": 1, "explanation": "Code A 4.1 requires the record to be made on the spot unless that is wholly impracticable; if so, it must be made as soon as practicable afterwards.", "reference": "Code A 4.1 • Blackstone GPD 2023 Stop & Search p. 19"}, {"id": 27, "topic": "Stop & Search — PACE Code A", "question": "A person is searched but not arrested and is not given a copy of the record at the scene. How long do they have to request access to the record?", "options": ["14 days.", "28 days.", "Three months from the date of the search.", "One year."], "answer": 2, "explanation": "The supplied Code A text states that where a copy is not provided at the time, the person may apply for a copy/access within three months.", "reference": "PACE 1984 s.3; Code A 4.2 • Blackstone GPD 2023 Stop & Search pp. 18-20"}, {"id": 28, "topic": "Stop & Search — PACE Code A", "question": "A stop and search leads directly to arrest. How may the search record be made?", "options": ["No record is required because an arrest occurred.", "It may be made as part of the person's custody record at the police station.", "It must be sent to a magistrates' court.", "It must be completed only after charge."], "answer": 1, "explanation": "Code A provides that where a search results in arrest, the search record may be made as part of the person's custody record.", "reference": "Code A 4.2B • Blackstone GPD 2023 Stop & Search p. 20"}, {"id": 29, "topic": "Stop & Search — PACE Code A", "question": "Police search a vehicle and two occupants for the same object on the same grounds. Which recording rule applies?", "options": ["One record can cover everyone because the grounds are the same.", "A separate record must be made for each person searched; where a person and vehicle are searched on the same object and grounds, that person's record can also cover the vehicle search.", "Only the driver needs a record.", "No record is needed for the vehicle."], "answer": 1, "explanation": "Code A 4.5 requires a record for each person and each vehicle searched, but allows one record to cover a person and vehicle where the object and grounds are the same. More than one person searched requires separate person records.", "reference": "Code A 4.5 • Blackstone GPD 2023 Stop & Search p. 21"}, {"id": 30, "topic": "Stop & Search — PACE Code A", "question": "An unattended vehicle is searched under a statutory stop-and-search power. What must officers do after the search?", "options": ["Wait until the owner returns.", "Leave the required notice on or in the vehicle stating that it has been searched and giving the prescribed information.", "Tow the vehicle in every case.", "Notify the local authority."], "answer": 1, "explanation": "The supplied text requires a notice to be left on or in an unattended vehicle after search, with the required information and route to obtain the search record.", "reference": "Code A 4.8-4.9; Keynote 3.1.5.2 • Blackstone GPD 2023 Stop & Search pp. 18, 21"}, {"id": 31, "topic": "Stop & Search — PACE Code A", "question": "An officer records the grounds for a search simply as 'known thief in a high-crime area'. What is the problem?", "options": ["The record need only identify the person's previous convictions.", "The record should briefly but informatively explain the reason for suspecting the person, with reference to the information and/or intelligence on which it was based.", "Grounds never need to be recorded.", "Only the outcome of the search matters."], "answer": 1, "explanation": "Code A 4.6 requires the grounds entry to explain briefly but informatively why the person was suspected, with reference to the information and/or intelligence relied on.", "reference": "Code A 4.6 • Blackstone GPD 2023 Stop & Search p. 21"}, {"id": 32, "topic": "Stop & Search — PACE Code A", "question": "An officer stops a person in a public place merely to ask where they are going and why, without using a statutory stop-and-search power. What is the national recording requirement under the supplied Code A text?", "options": ["A full stop-and-search record is mandatory.", "There is no national requirement to record that non-statutory encounter or give a receipt merely because the officer asked such questions.", "The encounter must be authorised by an Inspector.", "The person must provide fingerprints."], "answer": 1, "explanation": "The Code states there is no national requirement to record encounters not governed by statutory stop-and-search powers merely because an officer asks a person to account for themselves, their actions, behaviour, presence or possession.", "reference": "Code A 4.12 • Blackstone GPD 2023 Stop & Search p. 22"}, {"id": 33, "topic": "Stop & Search — PACE Code A", "question": "A person searched speaks very little English and appears not to understand the information being given. What should the officer do?", "options": ["Proceed without explaining anything because the power is statutory.", "Take reasonable steps to bring the required information to the person's attention, using appropriate assistance or material where practicable.", "Arrest the person for non-cooperation.", "Abandon every lawful search involving a language barrier."], "answer": 1, "explanation": "Code A requires reasonable steps to make the required information understood where the person does not appear to understand English, including appropriate interpretation or explanatory material where practicable.", "reference": "Code A 3.10-3.11 • Blackstone GPD 2023 Stop & Search p. 18"}, {"id": 34, "topic": "Stop & Search — PACE Code A", "question": "A supervisor reviews a set of stop-and-search records at the end of a tour. What is a core supervisory responsibility?", "options": ["Check that powers are being used lawfully and appropriately, including scrutinising recorded grounds.", "Delete records where nothing was found.", "Approve only searches that led to arrest.", "Require a magistrate to countersign every search."], "answer": 0, "explanation": "Code A 5.1 onwards requires supervisors to monitor the use of stop-and-search powers and scrutinise records, including the grounds recorded and the way powers are being exercised.", "reference": "Code A 5.1-5.4 • Blackstone GPD 2023 Stop & Search p. 23"}, {"id": 35, "topic": "Stop & Search — PACE Code A", "question": "A supervisor identifies repeated searches by an officer where the recorded grounds do not support reasonable suspicion. What should the supervisor do?", "options": ["Ignore the issue unless a complaint is made.", "Review the circumstances and take appropriate action where misuse or a breach of standards is identified.", "Automatically dismiss the officer.", "Erase the search records."], "answer": 1, "explanation": "The supervision section requires active scrutiny and appropriate action where misuse is identified; the response depends on the facts and may include performance or misconduct processes.", "reference": "Code A 5.5-5.6 • Blackstone GPD 2023 Stop & Search p. 23"}, {"id": 36, "topic": "Stop & Search — PACE Code A", "question": "Police are planning stop-and-search activity involving children. What safeguarding duty is emphasised by Code A?", "options": ["Children must always be arrested before search.", "Police must have regard to the need to safeguard and promote the welfare of persons under 18.", "Every child search requires parental presence.", "Every child search must take place at a police station."], "answer": 1, "explanation": "Code A 1.1 refers to the duty under section 11 Children Act 2004 to have regard to the need to safeguard and promote the welfare of children.", "reference": "Children Act 2004 s.11; Code A 1.1 • Blackstone GPD 2023 Stop & Search p. 2"}, {"id": 37, "topic": "Stop & Search — PACE Code A", "question": "An officer has no statutory search power but asks a person to agree voluntarily to being searched in the street. What does Code A say?", "options": ["The search is lawful if the person signs a consent form.", "An officer must not search a person merely by consent where no statutory power applies, apart from the limited entry-condition exception described in the Code.", "Consent creates a temporary section 1 PACE power.", "Consent searches are allowed only for people over 18."], "answer": 1, "explanation": "Code A 1.5 prohibits routine consent searches where no statutory power exists, apart from the specific exception for searches as a condition of entry to premises such as sports grounds.", "reference": "Code A 1.5 • Blackstone GPD 2023 Stop & Search p. 2"}, {"id": 38, "topic": "Stop & Search — PACE Code A", "question": "An officer breaches important Code A safeguards during a search and evidence is later relied on in court. What consequence does Code A identify?", "options": ["The evidence is automatically destroyed.", "The evidence may be open to challenge in court.", "The prosecution automatically ends.", "The officer is automatically imprisoned."], "answer": 1, "explanation": "Code A 1.6 states that evidence obtained where the Code's provisions are not observed may be open to challenge.", "reference": "Code A 1.6 • Blackstone GPD 2023 Stop & Search p. 2"}, {"id": 39, "topic": "Stop & Search — PACE Code A", "question": "A stand-alone section 60AA authorisation is being considered, rather than relying on an existing section 60 authorisation. Which statement best reflects the authorisation route described in the supplied material?", "options": ["Any constable may create the power whenever a face covering is seen.", "An Inspector or above may authorise the power for a locality where the statutory test concerning activities involving offences is met; the individual constable must still reasonably believe an item is worn wholly or mainly to conceal identity before requiring removal.", "A magistrate must authorise every use.", "A Superintendent must personally identify every person wearing a face covering."], "answer": 1, "explanation": "The supplied section 60AA material distinguishes the area authorisation from the individual constable's exercise of the removal power. The latter depends on a reasonable belief that the item is worn wholly or mainly to conceal identity.", "reference": "CJPOA 1994 s.60AA; Keynote 3.1.4.9-3.1.4.10 • Blackstone GPD 2023 Stop & Search pp. 12-13"}, {"id": 40, "topic": "Stop & Search — PACE Code A", "question": "A person refuses a lawful requirement by a constable to remove an item under section 60AA. What is the legal consequence identified in the supplied material?", "options": ["No offence is committed.", "A specific offence is committed under section 60AA(7).", "Only a civil penalty is available.", "The refusal merely ends the encounter."], "answer": 1, "explanation": "The Keynote expressly identifies failure to comply with a lawful section 60AA requirement as an offence under section 60AA(7).", "reference": "CJPOA 1994 s.60AA(7); Keynote 3.1.4.14 • Blackstone GPD 2023 Stop & Search p. 14"}, {"id": 41, "topic": "Stop & Search — PACE Code A", "question": "A constable reasonably believes that an item worn for religious reasons is also being worn wholly or mainly to conceal identity, and a lawful removal power is engaged. What handling does the Code recommend where practicable?", "options": ["Remove it immediately in full public view.", "Allow removal out of public view and in the presence of an officer of the same sex.", "Only a Superintendent may be present.", "Religious items can never be removed even where the statutory test is met."], "answer": 1, "explanation": "The religious-sensitivities Keynote says that where removal is required, it should where practicable occur out of public view and in the presence of an officer of the same sex.", "reference": "Code A Keynote 3.1.4.12 • Blackstone GPD 2023 Stop & Search p. 14"}, {"id": 42, "topic": "Stop & Search — PACE Code A", "question": "An Inspector is briefing officers on the meaning of 'dangerous instruments' for section 60 purposes. What does the supplied text mean by 'dangerous instruments'?", "options": ["Only firearms.", "Instruments which have a blade or are sharply pointed.", "All offensive weapons and any object capable of harm.", "Controlled drugs."], "answer": 1, "explanation": "The section 60 material defines dangerous instruments as instruments which have a blade or are sharply pointed. Offensive weapons are a separate category in the statutory wording.", "reference": "CJPOA 1994 s.60; Keynote 3.1.4.7 • Blackstone GPD 2023 Stop & Search pp. 10-11"}, {"id": 43, "topic": "Stop & Search — PACE Code A", "question": "A constable is considering one of the specified Schedule 5 TPIM search powers. Do those powers always require reasonable grounds to suspect that the individual is contravening the TPIM or carrying the item sought?", "options": ["No. The supplied Code A text states that the specified TPIM powers do not require reasonable grounds of suspicion in the way ordinary suspicion-based powers do.", "Yes, and the suspicion must be confirmed by an Inspector.", "Yes, but only in private premises.", "Yes, but only for persons under 18."], "answer": 0, "explanation": "The TPIM section explains that the specified Schedule 5 powers may be exercised without the ordinary reasonable-suspicion requirement.", "reference": "TPIM Act 2011 Sch.5; Code A 2.18A-2.20 • Blackstone GPD 2023 Stop & Search p. 15"}, {"id": 44, "topic": "Stop & Search — PACE Code A", "question": "A search warrant is issued under the TPIM Schedule 5 warrant provision described in Code A 2.20. Within what period must the search be carried out?", "options": ["24 hours.", "Seven days from issue.", "28 days.", "Three months."], "answer": 1, "explanation": "Code A 2.20 states that a search under that warrant must be carried out within seven days of issue.", "reference": "TPIM Act 2011 Sch.5; Code A 2.20 • Blackstone GPD 2023 Stop & Search p. 15"}, {"id": 45, "topic": "Stop & Search — PACE Code A", "question": "Under the same TPIM warrant provision, an officer is checking how often the individual may be searched. How many times may the individual be searched under that warrant within its validity period?", "options": ["Once.", "Twice.", "Unlimited times.", "Once per day."], "answer": 0, "explanation": "The supplied text states that the individual may be searched on one occasion only within the warrant period.", "reference": "TPIM Act 2011 Sch.5; Code A 2.20 • Blackstone GPD 2023 Stop & Search p. 15"}, {"id": 46, "topic": "Stop & Search — PACE Code A", "question": "An officer is recording the self-defined ethnicity of a person searched. Which Annex B code corresponds to 'White - British'?", "options": ["W1.", "M1.", "A1.", "B1."], "answer": 0, "explanation": "Annex B lists 'White - British' as W1.", "reference": "Code A Annex B • Blackstone GPD 2023 Stop & Search Annex B, p. 25"}, {"id": 47, "topic": "Stop & Search — PACE Code A", "question": "A designated Community Support Officer has lawfully detained a person under the Police Reform Act 2002 powers shown in Annex C. For what may the designated CSO search the detained person without consent under the relevant Schedule 4 power?", "options": ["Any controlled drugs.", "Objects that might be used to cause physical injury or to assist escape.", "Evidence of any offence whatsoever.", "Documents proving identity only."], "answer": 1, "explanation": "Annex C identifies the designated CSO power to search a lawfully detained person for objects that might cause physical injury or assist escape.", "reference": "Police Reform Act 2002 Sch.4; Code A Annex C • Blackstone GPD 2023 Stop & Search Annex C, p. 25"}, {"id": 48, "topic": "Stop & Search — PACE Code A", "question": "An officer is considering a search under section 4 Crossbows Act 1987. Which description matches the Annex A entry?", "options": ["Crossbows or parts of crossbows, subject to the statutory description, with the power exercisable anywhere except dwellings.", "Only knives carried by persons under 18.", "Only air weapons in public places.", "Only bows carried at sporting events."], "answer": 0, "explanation": "Annex A lists Crossbows Act 1987 s.4 for crossbows or parts of crossbows, subject to the statutory description in the table, and states the power is exercisable anywhere except dwellings.", "reference": "Crossbows Act 1987 s.4; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 25"}, {"id": 49, "topic": "Stop & Search — PACE Code A", "question": "Police are exercising the Protection of Badgers Act 1992 search power listed in Annex A. Where does the Annex A table state the power is exercisable?", "options": ["In a public place only.", "Anywhere.", "Anywhere except dwellings.", "Only on Crown land."], "answer": 1, "explanation": "Annex A lists the Protection of Badgers Act search power as exercisable anywhere.", "reference": "Protection of Badgers Act 1992; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 25"}, {"id": 50, "topic": "Stop & Search — PACE Code A", "question": "Police are exercising the Wildlife and Countryside Act 1981 search power listed in Annex A. Where does the Annex A table state the power is exercisable?", "options": ["Anywhere except dwellings.", "In public places only.", "Inside dwellings only.", "Only in national parks."], "answer": 0, "explanation": "Annex A lists the Wildlife and Countryside Act search power as exercisable anywhere except dwellings.", "reference": "Wildlife and Countryside Act 1981; Code A Annex A • Blackstone GPD 2023 Stop & Search Annex A, p. 25"},{"id":51,"topic":"Detention & Interviews — PACE Code C","question":"A patrol officer asks a motorist solely for their name and whether they own the car. No investigation-related questions are put.\n\nWhich approach complies with Code C?","options":["Give a caution before any identity question.","Ask without caution because the questions solely establish identity and vehicle ownership.","Caution only if the officer wears plain clothes.","Require a solicitor before identifying the owner."],"answer":1,"explanation":"Paragraph 10.1(a) excepts questions put solely to establish identity or ownership of a vehicle; offence-related questioning after suspicion arises is different.","reference":"Code C 10.1(a)"},{"id":52,"topic":"Detention & Interviews — PACE Code C","question":"An officer with grounds under PACE s1 asks a suspect whether a sharp object is in their coat before beginning a lawful search, to conduct it safely.\n\nIs a caution required solely for this search-safety question?","options":["Yes, because an offence is suspected.","No, if asked in furtherance of the proper and effective conduct of the search.","Yes, unless the suspect volunteers the answer.","Only when a search finds stolen property."],"answer":1,"explanation":"Code C 10.1(c) excepts questions genuinely in furtherance of a proper search; using the exchange to investigate the offence would require separate consideration under 10.1.","reference":"Code C 10.1(c)"},{"id":53,"topic":"Detention & Interviews — PACE Code C","question":"A person attends a station voluntarily to be interviewed under caution about shoplifting. The interviewer prepares to caution them.\n\nWhat must the interviewer additionally explain at that time?","options":["The suspect is detained until the interview finishes.","They are not under arrest, must agree to be interviewed, and have applicable legal-advice and voluntary-interview rights.","They may leave only after an inspector authorises departure.","The caution removes their entitlement to legal advice."],"answer":1,"explanation":"Code C 10.2 requires the non-arrested suspect to be told they are not under arrest and informed of the voluntary-interview provisions in 3.21–3.22, including consent and legal advice.","reference":"Code C 10.2, 3.21–3.22"},{"id":54,"topic":"Detention & Interviews — PACE Code C","question":"A suspect being arrested is violently struggling and cannot engage with the arresting officer. An immediate caution is not practicable.\n\nWhat does Code C require?","options":["Give the caution instantly, irrespective of behaviour.","Give the caution as soon as practicable once the condition or behaviour no longer prevents it.","Omit the caution permanently if the arrest is on body-worn video.","Defer the caution until charge in all violent-arrest cases."],"answer":1,"explanation":"Paragraph 10.4(a) recognises impracticability due to condition or behaviour; the obligation resumes when it becomes practicable.","reference":"Code C 10.3–10.4; Code G section 3"},{"id":55,"topic":"Detention & Interviews — PACE Code C","question":"An authorised-place detainee has not been allowed an opportunity to consult a solicitor before an interview. Officers plan to rely on silence at trial.\n\nWhat is the implication for the caution and section 34 inferences?","options":["Use the standard inference caution and draw inferences routinely.","Use the Annex C alternative caution; section 34 inferences are restricted for that questioning.","Use the post-charge caution because legal advice has not arrived.","Do not caution at all before offence questioning."],"answer":1,"explanation":"The restriction in CJPOA 1994 s34(2A) and Code C Annex C prevents relevant section 34 inferences and requires the alternative caution where it applies.","reference":"Code C 10.6 and Annex C; CJPOA 1994 s34(2A)"},{"id":56,"topic":"Detention & Interviews — PACE Code C","question":"An officer delivers an otherwise accurate caution using slightly different words while retaining its full meaning.\n\nWhat is the consequence under Code C?","options":["Every variation is automatically a breach.","A minor deviation is not a breach if the sense is preserved.","A variation needs prior superintendent approval.","Variation is permitted only at a voluntary interview."],"answer":1,"explanation":"Code C 10.7 permits minor wording deviations if the sense of the relevant caution is preserved; genuine misunderstanding must still be addressed.","reference":"Code C 10.7 and Note 10D"},{"id":57,"topic":"Detention & Interviews — PACE Code C","question":"After a meal break, an interviewer reminds an alert suspect that they remain under caution. The suspect indicates understanding.\n\nMust the full caution be recited again?","options":["Yes, after any break exceeding 15 minutes.","No; the suspect must be aware they remain under caution, with full repetition if there is doubt.","Only if the solicitor asks for it.","Only after an overnight break."],"answer":1,"explanation":"Code C 10.8 requires awareness that the suspect remains under caution after any break; when there is doubt, the caution should be given again in full.","reference":"Code C 10.8"},{"id":58,"topic":"Detention & Interviews — PACE Code C","question":"An arrested burglary suspect is interviewed at an authorised place about jewellery found in their coat at arrest. Officers consider a CJPOA s36 special warning.\n\nWhich information must the warning convey before a proper inference can be drawn?","options":["Only that failure to answer will amount to another offence.","The investigated offence, fact to account for, suspected link, possibility of inference, and existence and potential evidential use of the interview record.","Only the suspected offence and the custody authorisation.","A promise that answering will automatically prevent prosecution."],"answer":1,"explanation":"Code C 10.10–10.11 sets out the five matters for the special warning, provided the Annex C restriction does not apply and all statutory prerequisites are met.","reference":"Code C 10.10–10.11; CJPOA 1994 s36"},{"id":59,"topic":"Detention & Interviews — PACE Code C","question":"A 15-year-old is properly cautioned upon arrest before any appropriate adult has arrived at the scene.\n\nWhat must happen when the appropriate adult is present?","options":["Nothing; the street caution always suffices.","Repeat the caution in the appropriate adult’s presence.","Give the caution again only if the child confesses.","Obtain a written waiver before any further caution."],"answer":1,"explanation":"Code C 10.12 requires repetition of a caution previously given without the appropriate adult to a juvenile or vulnerable person.","reference":"Code C 10.12"},{"id":60,"topic":"Detention & Interviews — PACE Code C","question":"Investigators want to give a vulnerable adult a section 36 special warning; the appropriate adult has not arrived.\n\nWhat does Code C require?","options":["Issue the warning now and repeat it later.","Do not give the paragraph 10.11 information until the appropriate adult is present.","Give the warning in writing without an appropriate adult.","Ask a sergeant to waive the requirement."],"answer":1,"explanation":"Code C 10.11A forbids giving the paragraph 10.11 special-warning information to a juvenile or vulnerable suspect without an appropriate adult.","reference":"Code C 10.11A"},{"id":61,"topic":"Detention & Interviews — PACE Code C","question":"An arresting officer cautions a suspect on the street; the entire interaction is captured by body-worn video.\n\nWhat does Code C require about documenting the caution?","options":["No separate record is needed whenever video exists.","Record the caution in the interviewer’s report book or interview record.","Record it only if the suspect refuses to answer.","The custody officer must create the only permitted record."],"answer":1,"explanation":"Code C 10.13 requires a record of cautions in the interviewer’s report book or interview record; video does not itself displace the Code wording.","reference":"Code C 10.13"},{"id":62,"topic":"Detention & Interviews — PACE Code C","question":"Following a proper caution, a driver refuses to supply information required under road-traffic legislation and invokes the right to silence.\n\nWhat should the officer explain?","options":["The caution removes the statutory duty to provide information.","The relevant legal consequences of refusal and that the caution does not alter them.","No consequence can follow until a solicitor arrives.","Refusal automatically proves the suspected motoring offence."],"answer":1,"explanation":"Code C 10.9 says the person should be informed of relevant consequences of refusing statutorily required information, which are not affected by the caution.","reference":"Code C 10.9"},{"id":63,"topic":"Detention & Interviews — PACE Code C","question":"A burglary witness unexpectedly says something that provides objective grounds to suspect them. The officer intends to question them further about their own involvement for evidential purposes.\n\nWhat must happen first?","options":["Complete the witness statement before cautioning.","Caution the person before asking further offence-related evidential questions.","Arrest automatically, even where necessity is absent.","Continue the exchange as an informal witness conversation."],"answer":1,"explanation":"Under Code C 10.1, when an answer gives grounds for suspicion, caution is required before further relevant offence questions whose answers or silence may be evidence.","reference":"Code C 10.1 and Note 10A"},{"id":64,"topic":"Detention & Interviews — PACE Code C","question":"A Welsh-speaking suspect in Wales asks for the caution in Welsh and the officer can give the approved wording accurately.\n\nWhat is permitted?","options":["Welsh is permitted only at a Crown Court.","The caution may be given in Welsh where use of Welsh is appropriate.","The suspect must prove inability to speak English first.","Only an inspector may authorise the Welsh caution."],"answer":1,"explanation":"Code C 10.5 expressly permits the approved Welsh caution where use of the Welsh language is appropriate.","reference":"Code C 10.5"},{"id":65,"topic":"Detention & Interviews — PACE Code C","question":"A station detainee has asked for a solicitor and has not been allowed an opportunity to consult before urgent questioning.\n\nWhich statement addresses silence inferences?","options":["A standard caution automatically makes s34 inferences available.","Section 34(2A) restricts adverse inference from the relevant silence; the alternative caution applies.","Inspector approval to interview removes the statutory restriction.","The restriction applies only when the detainee is under 18."],"answer":1,"explanation":"The absence of an allowed consultation opportunity engages CJPOA s34(2A); emergency interview authorisation does not itself permit an adverse inference prohibited by that subsection.","reference":"Code C 10.6 and Annex C; CJPOA s34(2A)"},{"id":66,"topic":"Detention & Interviews — PACE Code C","question":"On a public street, an officer asks a person reasonably suspected of robbery where they were when the offence occurred, intending to use their answers as evidence.\n\nDoes the location prevent this being an interview?","options":["Yes; an interview can occur only inside a designated suite.","No; questioning about suspected involvement requiring a caution is an interview irrespective of location.","Yes, unless the exchange exceeds 15 minutes.","Yes, if the person has not yet been arrested."],"answer":1,"explanation":"Code C 11.1A defines interview by the nature of offence-related questioning required to be under caution, not by location or duration; 11.1 separately restricts interviewing after arrest.","reference":"Code C 11.1A and 11.1"},{"id":67,"topic":"Detention & Interviews — PACE Code C","question":"A detained assault suspect tells an escorting officer, before the formal interview, that they struck the complainant in self-defence.\n\nWhat should the interviewer do at the start?","options":["Ignore the remark because it was outside the recorded interview.","After caution, put the significant statement to the suspect and ask for confirmation or denial and any additions.","Treat it as an automatic guilty plea.","Mention it only if the defence solicitor requests it."],"answer":1,"explanation":"Under Code C 11.4, a significant pre-interview statement heard by police staff and not previously put to the suspect must be put at the start of interview, with confirmation/denial and opportunity to add.","reference":"Code C 11.4–11.4A"},{"id":68,"topic":"Detention & Interviews — PACE Code C","question":"After arrest for burglary, officers seek to question a suspect at the scene because a co-suspect is about to destroy evidence; necessary questions can avert that risk.\n\nWhich approach accords with Code C?","options":["All scene interviews are prohibited after arrest.","A tightly limited urgent scene interview may occur if delaying until authorised detention would create the specified evidential risk; stop once averted.","The whole evidential interview may take place at the scene whenever convenient.","Only a court warrant permits urgent questions outside a station."],"answer":1,"explanation":"Paragraph 11.1 permits post-arrest questioning outside an authorised place only for specified risks, including interference with evidence; questioning must end when the relevant risk is averted.","reference":"Code C 11.1"},{"id":69,"topic":"Detention & Interviews — PACE Code C","question":"A 17-year-old in custody says they do not want an appropriate adult and asks to be interviewed at once. There is no urgent threat to people, property or evidence.\n\nWhat should the interviewing officer do?","options":["Interview if the young person signs a waiver.","Arrange an appropriate adult before interviewing, notwithstanding the request.","Interview if a custody sergeant assesses the detainee as mature.","Ask an inspector to dispense with the appropriate adult as a routine exception."],"answer":1,"explanation":"A person appearing under 18 is treated as a juvenile under 1.5. Paragraph 11.15 requires an appropriate adult unless a specific urgent exception applies; preference or apparent maturity does not dispense with that safeguard.","reference":"Code C 2023 paragraphs 1.5, 11.15 and 11.18–11.20"},{"id":70,"topic":"Detention & Interviews — PACE Code C","question":"A detained vulnerable adult is suspected of planting an explosive device that may detonate shortly. An appropriate adult cannot be located in time. The custody officer considers the person physically and mentally fit enough for narrowly focused questions.\n\nWhich safeguard governs an urgent interview without the appropriate adult?","options":["An inspector may authorise a full evidential interview for any serious offence.","A superintendent or above must assess the risks of delay and that the interview would not significantly harm the suspect; questioning must stop once the risk is averted.","An urgent interview is lawful only after a court warrant.","Urgency removes all requirements to record the grounds for interviewing."],"answer":1,"explanation":"Under paragraphs 11.18–11.20, a superintendent or above must consider the specified consequences of delay and be satisfied there would be no significant harm to the detainee’s physical or mental state. The interview must cease once enough information to avert the risk is obtained; grounds must be recorded.","reference":"Code C 2023 paragraphs 11.18–11.20 and 12.3"},{"id":71,"topic":"Detention & Interviews — PACE Code C","question":"During an interview, a solicitor challenges two misleading questions and advises the suspect to give no comment. The interviewer is irritated but can continue putting questions properly.\n\nWhich action is consistent with Code C paragraphs 6.9–6.10?","options":["Require the solicitor to leave whenever advice to remain silent disrupts the interviewing strategy.","Continue the interview; the described conduct does not meet the threshold for removal.","Stop the interview and have any inspector authorise the solicitor’s removal without hearing from them.","Remove the solicitor and allow the suspect to consult a replacement only after completing the interview."],"answer":1,"explanation":"Paragraph 6.9 permits requiring a solicitor to leave only if their conduct makes the interviewer unable properly to put questions. On these facts that threshold is not met. If it were met, 6.10 requires stopping the interview and consulting a superintendent if readily available, otherwise an independent inspector or above; the consulted officer speaks to the solicitor before deciding.","reference":"PACE Code C 2023 paragraphs 6.9–6.10"},{"id":72,"topic":"Detention & Interviews — PACE Code C","question":"A suspect has been interviewed for approximately two hours. They last ate three hours ago. The interviewer wishes to continue immediately because the account is developing, but identifies no specific risk from taking a break.\n\nWhat does Code C paragraph 12.8 require?","options":["Provide a short refreshment break at approximately the two-hour point, taking meal timing into account.","Delay all breaks until the suspect requests one, provided no interview exceeds four hours.","Provide a break only if the solicitor confirms that a pause will not interrupt the account.","Obtain inspector authorisation before any break taken during active questioning."],"answer":0,"explanation":"Code C 12.8 says short refreshment breaks shall be provided at approximately two-hour intervals. An interviewer may delay where reasonable grounds exist for one of the specified risks, including harm, serious property loss or damage, unnecessary delay of release, or prejudice to the investigation. No such grounds are present here.","reference":"PACE Code C 2023 paragraph 12.8; Note 12B"},{"id":73,"topic":"Detention & Interviews — PACE Code C","question":"A detainee is severely intoxicated and cannot understand ordinary questions. Investigators want an immediate interview solely because the normal custody period is approaching. There is no urgent risk of harm, alerting suspects, or loss of evidence.\n\nWhat is the proper course?","options":["Interview if the detainee signs a consent form.","Do not interview until fit; expiry of available detention time alone does not meet the urgent-interview criteria.","Interview if an appropriate adult is willing to attend.","A custody sergeant may dispense with fitness assessment by recording the pressure of time."],"answer":1,"explanation":"Paragraph 12.3 requires the custody officer to assess fitness and safeguard physical and mental health. Paragraph 11.18 allows specified urgent interviews only with superintendent assessment of the risks in paragraph 11.1 and absence of significant harm. Routine pressure from detention time alone does not establish that exception.","reference":"Code C 2023 paragraphs 12.3, 11.18–11.20 and 11.1"},{"id":74,"topic":"Detention & Interviews — PACE Code C","question":"An interview takes place in a temporary room with inadequate heating and lighting. Officers insist the detainee remain standing for the entire interview, although seating is available nearby.\n\nWhich statement accurately identifies the Code C interview safeguards engaged?","options":["Code C 12.4 addresses the interview environment and 12.6 prohibits requiring a person being questioned to stand.","Code C 11.7 prohibits standing only when an interview lasts more than one hour.","Code C 12.8 allows an interviewer to dispense with seating if a refreshment break is provided.","Code C 12.4 deals only with audio equipment; physical interview conditions are left entirely to officer discretion."],"answer":0,"explanation":"Code C paragraph 12.4 requires adequate interview conditions, including heating and lighting; paragraph 12.6 says people being questioned or making statements shall not be required to stand. The original question misattributed both rules to 11.7.","reference":"PACE Code C 2023 paragraphs 12.4 and 12.6"},{"id":75,"topic":"Detention & Interviews — PACE Code C","question":"An officer investigating a theft has put all relevant questions to the suspect, tested their innocent explanation, considered the other available evidence and reasonably believes there is now sufficient evidence to provide a realistic prospect of conviction.\n\nUnder Code C paragraph 11.6, what should happen to questioning about that offence?","options":["Continue until a confession is obtained, provided the 24-hour detention limit has not expired.","Cease the interview about that offence; the paragraph 11.6 conditions have been met.","Continue until every witness statement has been read aloud, whether relevant or not.","Refer continuation of questioning to a superintendent for automatic authorisation."],"answer":1,"explanation":"Paragraph 11.6 sets three cumulative conditions: all questions considered relevant to accurate and reliable information have been put, other available evidence has been considered, and the relevant officer reasonably believes there is sufficient evidence for a realistic prospect of conviction. Once these conditions are met, the interview about the offence must cease.","reference":"PACE Code C 2023 paragraph 11.6(a)–(c)"},{"id":76,"topic":"Detention & Interviews — PACE Code C","question":"A lawful urgent interview proceeds without functioning audio equipment and a written contemporaneous account is made.\n\nHow should the completed written record be verified?","options":["Ask the suspect to read/check it and sign or indicate disagreement under the applicable record procedure.","Keep it from the suspect until court proceedings.","Treat the interviewer’s signature as a substitute for all suspect verification.","Offer access only after the suspect is released."],"answer":0,"explanation":"Code C 11.7–11.13 governs written records: provide an opportunity to read or have the record read and to sign or record disagreement or refusal; ensure Code E exceptions also apply.","reference":"Code C 11.7–11.13; Code E"},{"id":77,"topic":"Detention & Interviews — PACE Code C","question":"A solicitor attends for a burglary suspect. The investigator withholds every detail of the suspected offence, alleging Code C prohibits pre-interview disclosure.\n\nWhat does Code C require?","options":["Give the entire prosecution and unused-material file.","Provide sufficient information about the offence and grounds for suspicion for effective defence rights, without necessarily disclosing details prejudicing the investigation.","Tell the solicitor only the charge code, irrespective of what the suspect could understand.","No information need be given before a confession."],"answer":1,"explanation":"Code C 11.1A requires sufficient information before interview for the suspect and solicitor to understand the offence and grounds for suspicion while allowing justified protection of investigation details; disclosure and timing must be recorded.","reference":"Code C 11.1A"},{"id":78,"topic":"Detention & Interviews — PACE Code C","question":"A suspect provides a prepared statement then answers no comment. At trial they rely on a significant additional fact omitted from the statement and interview.\n\nWhich proposition about a section 34 inference is accurate?","options":["The statement prevents every possible inference regardless of omitted facts.","An inference may be considered if statutory conditions are met and it would have been reasonable to mention the new fact when questioned.","No-comment answers automatically require an adverse inference.","A prepared statement cannot ever form part of the evidence."],"answer":1,"explanation":"CJPOA s34 permits a proper inference only where relevant statutory conditions are met; a prepared statement is not blanket protection for new facts first raised at trial.","reference":"CJPOA 1994 s34; Code C 10.5–10.6"},{"id":79,"topic":"Detention & Interviews — PACE Code C","question":"A detained suspect cannot understand English. A superintendent considers an urgent interview to identify the location of a hostage because obtaining an interpreter would cause serious delay. The proposed interviewer cannot speak the suspect’s language or otherwise communicate effectively.\n\nCan the interview proceed under the urgent-interview exception?","options":["Yes, if an inspector sits in on the interview.","No; the urgent exception for a missing interpreter still requires an interviewer who can communicate effectively in the suspect’s language or by other sufficient means.","Yes; any automated translation app is treated as an independent interpreter.","Yes, provided officers limit the interview to 15 minutes."],"answer":1,"explanation":"Paragraph 11.18(c) permits specified urgent questioning without an arranged interpreter only where the interviewer speaks the suspect’s language or otherwise establishes effective communication sufficient for the necessary questions. Paragraph 13.2 otherwise requires an interpreter.","reference":"Code C 2023 paragraphs 11.18(c), 11.19, 11.20 and 13.2"},{"id":80,"topic":"Detention & Interviews — PACE Code C","question":"A defendant alleges a confession was obtained by oppression during custody questioning. The prosecution disputes the allegation.\n\nWhat is the section 76(2) burden?","options":["The defence must prove oppression on the balance of probabilities.","The prosecution must prove beyond reasonable doubt that the confession was not obtained as alleged before it is admitted.","The accusation alone permanently excludes the confession without enquiry.","The custody officer decides admissibility."],"answer":1,"explanation":"Under PACE s76(2), when the relevant representation is made, a confession is inadmissible unless the prosecution proves beyond reasonable doubt that it was not obtained by oppression or qualifying unreliability.","reference":"PACE 1984 s76(2); Code C 11.5"},{"id":81,"topic":"Detention & Interviews — PACE Code C","question":"A suspect is to be interviewed in custody for an indictable offence. Working approved recording equipment is available and no exception applies.\n\nWhich recording procedure should be used?","options":["An officer may freely elect brief written notes instead.","Record in accordance with the applicable Code E audio-recording requirements, or Code F where visual recording is used.","Record only if the offence is homicide.","Wait until trial to produce the first interview record."],"answer":1,"explanation":"Code C 11.7 requires an accurate record and the relevant Code E/F provisions govern required recorded interviews; an officer cannot substitute discretionary notes when mandatory recording applies.","reference":"Code C 11.7; PACE Codes E and F"},{"id":82,"topic":"Detention & Interviews — PACE Code C","question":"During a juvenile suspect’s interview, the appropriate adult asks the officer to rephrase a confusing question and advises the juvenile. The officer demands total silence from the adult.\n\nWhich response reflects the Code?","options":["The adult must remain silent unless a solicitor asks them to intervene.","The appropriate adult may advise, support communication and help safeguard fairness; they are not a passive observer.","The adult can answer every substantive question for the juvenile.","The adult must leave whenever an investigator considers questioning slow."],"answer":1,"explanation":"Code C 11.17 and 1.7A give the appropriate adult an active safeguarding, advice and communication role; they do not displace the suspect’s own answers.","reference":"Code C 11.17 and 1.7A"},{"id":83,"topic":"Detention & Interviews — PACE Code C","question":"An officer has strong CCTV evidence of theft but does not ask the suspect about it or allow an innocent explanation before deciding the interview is complete.\n\nWhat interviewing principle is engaged?","options":["Evidence against the suspect must be withheld until trial.","The officer should pursue reasonable lines of enquiry and relevant questions, including a fair opportunity for an innocent explanation before applying the 11.6 cessation test.","Code C requires full disclosure of all unused material at interview.","An interview cannot mention video unless a supervisor attends."],"answer":1,"explanation":"Code C 11.6(a) expressly includes an opportunity to give an innocent explanation and questions testing its accuracy; Note 11B refers to reasonable lines of enquiry, towards or away from suspicion.","reference":"Code C 11.6(a) and Note 11B"},{"id":84,"topic":"Detention & Interviews — PACE Code C","question":"Before interview a detainee asks to consult their solicitor privately. An officer insists that the consultation take place in the officer’s hearing. No lawful delay is authorised.\n\nWhat right applies?","options":["The consultation may be overheard if the room is busy.","The detainee is entitled to private legal consultation; officers should arrange it subject to any valid statutory exception.","Only a written consultation is protected.","Privacy applies only after charge."],"answer":1,"explanation":"PACE s58 and Code C section 6 protect access to private legal advice; routine officer presence is incompatible with that entitlement.","reference":"PACE s58; Code C 6.1"},{"id":85,"topic":"Detention & Interviews — PACE Code C","question":"After charge for robbery, officers discover genuinely new evidence relevant to that offence. They propose narrowly focused additional questioning.\n\nWhich statement reflects Code C?","options":["Further questioning is never permitted after charge.","An interview may occur for the listed exceptions, including genuinely new evidence, subject to safeguards and relevant caution.","Any post-charge interview is permitted if the investigator is curious.","Only magistrates can authorise clarification questions."],"answer":1,"explanation":"Code C 16.5 prohibits interviewing after charge except specified necessities including prevention of harm/loss, clearing ambiguity, or new information coming to light; the applicable cautions and advice reminders still matter.","reference":"Code C 16.5"},{"id":86,"topic":"Detention & Interviews — PACE Code C","question":"A detained suspect arrives at a station after arrest. The custody officer plans to mention free legal advice for the first time just before interview.\n\nWhen should the detainee receive the rights information?","options":["Only after interview if the detainee did not ask.","As part of the initial custody information on arrival, together with the other required rights and written notice.","Only after an inspector reviews detention.","After the first detention review unless a solicitor attends."],"answer":1,"explanation":"Code C 3.1–3.2 requires rights information at the outset of police detention and a written notice; it must not routinely be withheld until interview.","reference":"Code C 3.1–3.2"},{"id":87,"topic":"Detention & Interviews — PACE Code C","question":"Investigators request a delay in access to legal advice for a detainee held for an indictable offence and identify specific statutory risks.\n\nWho may authorise the statutory delay under the ordinary PACE route?","options":["An inspector, whenever the offence is either-way.","A superintendent or above, if the qualifying statutory grounds and all safeguards are satisfied.","A custody sergeant, if the interview is urgent.","The officer in charge of the case, regardless of rank."],"answer":1,"explanation":"PACE s58(6) and Code C Annex B require authorisation by an officer of superintendent rank or above and satisfaction of the specific statutory conditions; indictable detention alone is insufficient.","reference":"PACE s58(6); Code C Annex B"},{"id":88,"topic":"Detention & Interviews — PACE Code C","question":"An indictable-offence detainee asks for a family member to be informed. Police have concrete grounds to believe immediate notification would alert unarrested accomplices.\n\nWhich decision is permitted under the applicable statutory rules?","options":["The request may be ignored whenever informing anyone is inconvenient.","A qualifying delay may be authorised under PACE s56 and Annex B on specified grounds by the appropriate authorising rank, recorded and kept under review.","A family member can never be informed before charge.","An officer may suppress notification without making any record."],"answer":1,"explanation":"PACE s56 and Code C Annex B permit only properly authorised and evidenced delays on specified grounds such as alerting others suspected of involvement, not convenience; grounds must be recorded.","reference":"PACE s56; Code C Annex B"},{"id":89,"topic":"Detention & Interviews — PACE Code C","question":"An inspector reviews a theft suspect’s continued detention. The solicitor asks to make representations before the review decision.\n\nWhich procedure is appropriate?","options":["Refuse all submissions because reviews are internal police decisions.","Provide the statutory opportunity to make representations, orally or in writing, before determining continued detention.","Hear submissions only if the suspect has been charged.","Receive submissions only after the review has been completed."],"answer":1,"explanation":"PACE s40 and Code C 15.3 provide an opportunity for representations before continued detention is authorised, subject to the specific Code exceptions.","reference":"PACE s40; Code C 15.3"},{"id":90,"topic":"Detention & Interviews — PACE Code C","question":"An inspector is due to undertake a statutory detention review. The detainee is asleep during a protected rest period; their solicitor is available to make representations.\n\nWhat is the correct approach under Code C?","options":["Wake the detainee so that the review can be performed at its due time.","Postpone the review automatically until the detainee wakes.","Carry out the review without waking the detainee, offer the solicitor an opportunity to make representations, and inform the detainee of the decision and reasons as soon as practicable after waking.","Miss the review and record it retrospectively when the detainee next requests legal advice."],"answer":2,"explanation":"Code C 15.3 expressly exempts a sleeping detainee from the opportunity to make representations at that review, while preserving the solicitor’s opportunity if available. Paragraph 15.7 requires the detainee to be informed of the outcome and reason as soon as practicable after waking. Sleep is not by itself a reason to defer the review.","reference":"PACE Code C 2023 paragraphs 15.3, 15.7, 15.16(a)"},{"id":91,"topic":"Detention & Interviews — PACE Code C","question":"A detainee has rested for only five hours in the last 24 and investigators want to start a routine interview at 03:00; no Code exception applies.\n\nWhat does Code C require?","options":["Five hours always suffices for an adult.","Provide a continuous rest period of at least eight hours in a 24-hour period, free from investigation-related interruption, subject to the Code exceptions.","Wake the detainee every two hours to renew the right to silence.","Rest is discretionary whenever custody time is limited."],"answer":1,"explanation":"Code C 12.2 provides at least eight continuous hours rest in any 24-hour period subject to its specified exceptions, normally at night.","reference":"Code C 12.2"},{"id":92,"topic":"Detention & Interviews — PACE Code C","question":"A detained suspect complains of sudden severe chest pain while custody officers are arranging an interview.\n\nWhat action takes precedence?","options":["Continue interview until the healthcare professional’s booked slot.","Secure immediate appropriate medical attention in accordance with Code C and clinical urgency.","Wait for inspector approval before summoning an ambulance.","Record the complaint only if the suspect asks twice."],"answer":1,"explanation":"Code C 9.5 requires appropriate medical attention as soon as reasonably practicable when a detainee appears physically or mentally ill, is injured, or requests examination; urgent chest pain calls for immediate clinical assessment.","reference":"Code C 9.5"},{"id":93,"topic":"Detention & Interviews — PACE Code C","question":"A 16-year-old is to be strip searched in custody, exposing intimate body parts. The young person has not requested that the appropriate adult leave, and there is no urgency or risk of serious harm.\n\nWhich arrangement complies with Annex A?","options":["The search must involve at least two people other than the detainee, including an appropriate adult; the searching officer must be the same sex as the detainee.","An inspector can authorise the searching officer to conduct the search alone.","The appropriate adult is excluded unless the young person expressly asks for one.","Two police officers may exclude the appropriate adult whenever their presence causes inconvenience."],"answer":0,"explanation":"Annex A paragraph 11(a) requires the searching officer to be the same sex. Paragraph 11(c) requires at least two people other than the detainee for strip searches exposing intimate body parts, one being the appropriate adult for a juvenile, subject to the stated urgency and juvenile-choice exceptions.","reference":"Code C 2023 Annex A paragraph 11(a)–(c)"},{"id":94,"topic":"Detention & Interviews — PACE Code C","question":"An intimate search is lawfully authorised to locate a concealed harmful article. A registered medical practitioner or nurse cannot reasonably practicably be obtained.\n\nWho may perform the search under the applicable statutory restriction?","options":["An appropriately selected constable of the same sex, within the narrow harmful-article exception.","Any available officer of either sex, without further safeguards.","A constable who chooses to search for Class A drugs as well.","Only the investigating inspector, irrespective of sex."],"answer":0,"explanation":"PACE s55 and Code C Annex A allow the narrow harmful-article exception where a suitable medical practitioner or nurse cannot practicably perform the search; same-sex rules and other safeguards remain.","reference":"PACE s55; Code C Annex A"},{"id":95,"topic":"Detention & Interviews — PACE Code C","question":"A superintendent authorises a lawful Annex B delay in a detainee’s access to legal advice. The investigating officer assumes an oral explanation is enough.\n\nWhat documentation is required?","options":["Nothing if delay is less than one hour.","Record the authorisation and the applicable reasons in the custody record, identifying the authorising officer as required.","Record it exclusively in the investigator’s private notebook.","Make a custody entry only after the suspect complains."],"answer":1,"explanation":"Code C 2.1–2.2 and Annex B require timely custody records of the relevant authority and grounds; the earlier Gemini citation to 3.5 alone is not the documentation rule.","reference":"Code C 2.1–2.2 and Annex B"},{"id":96,"topic":"Detention & Interviews — PACE Code C","question":"On booking into custody, a detainee refuses to reveal whether they possess sharp items and resists a search of their coat.\n\nWhich power applies?","options":["No search is lawful unless the detainee signs a consent form.","The custody officer may search or authorise a necessary custody search under PACE s54 and Code C 4.1, subject to the applicable safeguards.","Every custody search requires a magistrates’ warrant.","Only the arresting officer can search custody property."],"answer":1,"explanation":"PACE s54 and Code C 4.1 permit necessary custody property searches without detainee consent, subject to limits and Annex A for more intrusive searches.","reference":"PACE s54; Code C 4.1 and Annex A"},{"id":97,"topic":"Detention & Interviews — PACE Code C","question":"The investigator reasonably believes there is sufficient evidence for a realistic prospect of conviction for the sole offence being investigated.\n\nWhat should happen next under Code C 16.1?","options":["Continue interrogating until a confession is obtained.","Inform the custody officer without delay so the charging process can proceed in accordance with applicable CPS guidance.","Extend detention automatically by twelve hours.","Wait for a court to appoint the charging officer."],"answer":1,"explanation":"Code C 16.1 requires notification of the custody officer without delay once the realistic-prospect threshold is reasonably believed met, subject to its multi-offence qualification; charging action follows DPP guidance.","reference":"Code C 16.1–16.1B; PACE s37"},{"id":98,"topic":"Detention & Interviews — PACE Code C","question":"During detention, a suspect asks to consult Code C. A custody officer refuses because they believe the Codes are restricted internal manuals.\n\nWhat is the correct response?","options":["Deny access because the suspect is not legally represented.","Permit consultation; the Code must be available and the detainee must be informed of the entitlement.","Permit it only after an indictment is issued.","Offer access only if the detainee agrees to answer interview questions."],"answer":1,"explanation":"Code C 1.2 requires the Code to be available for detainees and the public; 3.1 includes notice of the right to consult the Codes.","reference":"Code C 1.2 and 3.1
